# Dependabot configuration for the GitHub mirror (the CI itself runs on GitLab).
# Third parties install covey from GitHub — open advisories are visible there, so
# updates should arrive there too.
#
# Three ecosystems at three places: the frontend under web/ (npm), the Go module
# in the repo root, and the base images of the Dockerfiles. Weekly, so it stays
# signal and does not turn into noise.
version: 2
updates:
  # Frontend: package.json/package-lock.json sit under web/.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for the harmless jumps; majors come on their own —
      # they are work of their own (see the React-19 step).
      minor-und-patch:
        update-types: ["minor", "patch"]

  # Control plane and daemon: one Go module in the repo root.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: ["minor", "patch"]

  # Base images of the Dockerfiles (final image, sandbox, egress proxy).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
