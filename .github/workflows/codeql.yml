# CodeQL: the static analysis of GitHub, for Go and the TypeScript
# frontend.
#
# It complements govulncheck instead of replacing it: govulncheck knows
# known vulnerabilities in DEPENDENCIES, CodeQL looks for patterns in OWN
# code — unvalidated input, path manipulation, missing error handling.
#
# Runs on pull requests and weekly: the rule sets keep developing, a run
# over unchanged code may find more later than it finds today.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "42 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # Go has to be compiled so that CodeQL sees the data flow — and for that
      # //go:embed needs an existing web/dist.
      - name: web/dist bereitstellen
        if: matrix.language == 'go'
        run: mkdir -p web/dist && echo '<!doctype html><title>ci</title>' > web/dist/index.html
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
