# Release pipeline: tag `v*` → built binaries as a GitHub Release.
#
# Why GitHub and not the GitLab side: the GitLab pipeline deploys the
# own instance (covey.work) and pushes images into a private registry —
# both unreachable for third parties. Whoever wants to install covey fetches it
# from GitHub, and for that it takes artefacts published there. Operating and
# installation tooling belongs in the product, not in the internal CI.
#
# `installer/install.sh` downloads exactly the files that come out of here.
# Whoever changes the archive naming scheme has to change the script along with
# it — there is no third place that mediates. The same file is also served by
# every running instance under /install.sh (it is embedded into the binary).
name: Release

on:
  push:
    tags: ["v*"]
  # Triggerable by hand to rehearse the pipeline without a tag. Without a tag
  # no release comes to be, only the artefacts on the run — otherwise a rehearsal
  # would be a publication.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For `git describe` and thereby for a speaking version, when the
          # run is started by hand without a tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Without web/dist the Go build fails: //go:embed pulls the frontend
      # into the binary. There is no release without an interface.
      - run: npm run build
        working-directory: web

      # check-latest (see ci.yml): a release should be built with the latest patch
      # of the series, not with whatever happens to lie on the runner image —
      # the standard library is linked into the binary as well.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Herkunft bestimmen
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          {
            echo "version=${version}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Cross-build without CGO — the same binary runs on every distribution,
      # independent of their libc. That is exactly what makes the installation per
      # script easy in the first place.
      #
      # darwin is along because covey is developed and tried out locally on
      # macOS; the sandbox providers still need Docker there.
      - name: Bauen
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -eu
          mkdir -p dist
          ldflags="-s -w \
            -X covey/internal/buildinfo.version=${VERSION} \
            -X covey/internal/buildinfo.commit=${COMMIT} \
            -X covey/internal/buildinfo.date=${DATE}"
          # One archive per program, not one with everything in it. They belong on
          # different machines: covey on the server, coveyd exclusively
          # IN the sandbox. Whoever puts both in the same search path has a
          # binary installed that never runs there.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$work/covey" ./cmd/covey
            tar -czf "dist/covey_${VERSION}_${os}_${arch}.tar.gz" -C "$work" covey
            rm -rf "$work"
          done

          # covey-runner for the same platforms as covey: it runs on a
          # foreign host, and which system that is is not decided by this
          # line. install.sh offers it as a component (--runner) and forms
          # the archive name from the binary name — without this block the
          # installer runs into a 404 for a program it offers.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$work/covey-runner" ./cmd/covey-runner
            tar -czf "dist/covey-runner_${VERSION}_${os}_${arch}.tar.gz" -C "$work" covey-runner
            rm -rf "$work"
          done

          # coveyd only for Linux: it runs only in the sandbox container, and that
          # is always Linux. Included for everyone who wants to build their own sandbox image
          # without needing the Go toolchain for it — Dockerfile.sandbox
          # itself keeps building it from source.
          for arch in amd64 arm64; do
            work="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$work/coveyd" ./cmd/coveyd
            tar -czf "dist/coveyd_${VERSION}_linux_${arch}.tar.gz" -C "$work" coveyd
            rm -rf "$work"
          done

      # One checksum per archive, in one file. install.sh downloads it and
      # compares before it unpacks anything — without this step
      # `curl | sh` would be exactly what people rightly warn about.
      - name: Prüfsummen
        run: |
          set -eu
          cd dist
          # Without the "./" prefix: install.sh looks for the line by the bare
          # filename, and a prefix would be a tripping hazard without use.
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: covey-dist
          path: dist/
          retention-days: 7

      # Only on a real tag. A rehearsal via workflow_dispatch ends
      # above with the artefacts.
      - name: Veröffentlichen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The release can already be there: whoever pushes a tag and writes the
          # description by hand is faster than this run — it builds ten archives
          # beforehand. Before, the step failed on
          # "already exists", and the release stayed standing WITHOUT artefacts. That
          # is the worse of two errors: a red checkmark one sees,
          # a release without archives one does not — installer/install.sh downloads
          # exactly these files and otherwise runs into a 404.
          #
          # So: if it exists, it gets the archives and keeps its text.
          # A description written by hand is worth more than the
          # generated one, and this run does not know which stood before.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} existiert — hänge die Artefakte an."
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  # The Mac app (#406), attached to the same release. On macOS, because a
  # Flutter build for the Mac needs Xcode — which is also why this is here
  # and not in the GitLab pipeline, whose runner is Linux.
  #
  # Signed and notarised when the repository has the means (secrets below);
  # without them the app is attached as the build left it, signed ad hoc, and
  # the release says so. A fork's rehearsal works either way.
  #
  #   MACOS_CERTIFICATE_P12       the Developer ID Application certificate
  #                               with its private key, base64
  #   MACOS_CERTIFICATE_PASSWORD  its password
  #   APPLE_API_KEY_P8            an App Store Connect API key (.p8), as text
  #   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
  mac-app:
    needs: release
    # macOS 26 for its SDK: the window uses NSGlassEffectView (Liquid Glass),
    # which an older Xcode does not know; on older systems the app falls
    # back at runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: xcodebuild -version

      # The version the app is developed with; a newer one is a change of its
      # own, not something a release picks up by the way.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Herkunft bestimmen
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          # The bundle's version has to be numbers: v0.9.1 → 0.9.1, and a
          # rehearsal between tags counts as 0.0.0.
          build_name="$(printf '%s' "$version" | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p')"
          {
            echo "version=${version}"
            echo "build_name=${build_name:-0.0.0}"
          } >> "$GITHUB_OUTPUT"

      - name: Bauen
        working-directory: mobile
        run: |
          flutter build macos --release \
            --build-name "${{ steps.meta.outputs.build_name }}" \
            --build-number "${{ github.run_number }}"

      - name: Zertifikat laden
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -eu
          if [ -z "${P12}" ]; then
            echo "Kein Zertifikat hinterlegt — die App wird unsigniert angehängt."
            exit 0
          fi
          # A keychain of its own for this run, removed at the end: the
          # certificate never lands in the runner's login keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "Keine Developer-ID-Application-Identität im Zertifikat" >&2; exit 1; }
          echo "MACOS_SIGNING_IDENTITY=${identity}" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          if [ -n "${API_KEY}" ]; then
            printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "APPLE_API_KEY_ID=${API_KEY_ID}"
              echo "APPLE_API_ISSUER_ID=${API_ISSUER_ID}"
            } >> "$GITHUB_ENV"
          fi

      - name: Signieren und packen
        working-directory: mobile
        run: tool/macos_release.sh "${{ steps.meta.outputs.version }}" "$GITHUB_WORKSPACE/dist-app"

      - uses: actions/upload-artifact@v4
        with:
          name: covey-app-macos
          path: dist-app/
          retention-days: 7

      # Only on a real tag, like the release job; that job has created the
      # release by now (needs: release).
      - name: Veröffentlichen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release upload "${GITHUB_REF_NAME}" dist-app/* --clobber
          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            # Said where the download is: an unsigned app is refused by
            # Gatekeeper, and whoever meets that should find the way past it.
            notes="$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)"
            printf '%s\n\n%s\n' "$notes" "**Mac app:** this build is not signed. After unpacking: right-click covey.app → Open, or \`xattr -dr com.apple.quarantine covey.app\`." \
              | gh release edit "${GITHUB_REF_NAME}" --notes-file -
          fi

      - name: Aufräumen
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
