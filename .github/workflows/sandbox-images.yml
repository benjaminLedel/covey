# Die Sandbox-Images, öffentlich gebaut und veröffentlicht.
#
# Warum hier und nicht in der GitLab-Seite: Die interne Pipeline baut sie in
# eine private Registry, an die kein Dritter kommt. Wer covey von GitHub
# installiert, stand bis hierher vor einem `make sandbox-images` — Images mit
# chromium, JDK, PHP und einem Flutter-SDK, mehrere Gigabyte Bauzeit auf der
# eigenen Maschine, und beim Upgrade wieder. Eine Container-Installation hat dafür nicht einmal
# ein Repository. Betriebswerkzeug gehört ins Produkt, und ein fertiges Image
# ist hier das Produkt.
#
# EIN Package, die Varianten als Tag-Präfix (`base-…`, `dev-…`, `dev-flutter-…`)
# statt ein Package je Arbeitsplatz: Sie werden zusammen gebaut, zusammen
# versioniert und zusammen gezogen — und eine Sichtbarkeit, die man einmal auf
# öffentlich stellt, ist eine weniger, die man vergessen kann. Das gilt umso
# mehr, seit es fünf davon sind.
#
# Zwei Architekturen auf je eigenem Runner statt per QEMU: Die Images
# installieren chromium, ein JDK und PHP über apt. Emuliert dauert das Stunden;
# GitHub stellt für öffentliche Repositories arm64-Runner bereit.
name: Sandbox images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Stufe 1: base je Architektur, gepusht per DIGEST und ohne Tag. Der Tag
  # entsteht erst in der Manifest-Stufe — sonst überschriebe die zweite
  # Architektur die erste, statt sich zu ihr zu gesellen.
  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für `git describe`, siehe unten
      - id: meta
        run: |
          set -eu
          echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: ${{ matrix.platform }}
          # Die Herkunft des coveyd im Image — `coveyd version` beantwortet
          # damit im Container, welcher Stand darin liegt.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          # Der Cache liegt an der Registry und nicht am Runner: Der nächste
          # Lauf zieht die Layer, die sich nicht geändert haben, statt chromium
          # noch einmal zu installieren.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests--base--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  base-manifest:
    needs: base
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--base--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="base-$GITHUB_REF_NAME base-latest"
          else
            tags="base-latest base-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # Eine Architektur, ein Digest: Steht hier eine andere Zahl, ist
          # etwas eingesammelt worden, das nicht zu diesem Profil gehört —
          # genau so entstand das Tag mit sechzehn Einträgen (#116). Lieber
          # laut scheitern als ein Manifest veröffentlichen, aus dem sich jeder
          # Host etwas anderes zieht.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          echo "ref=${image}:base-latest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${image}:base-latest"

  # Stage 2: every workplace that builds on the base just published. The tag is
  # enough as BASE_IMAGE — the registry hands each runner the architecture it
  # stands on, so arm64 builds on arm64 and amd64 on amd64.
  #
  # One matrix over profile x architecture instead of a job per profile: the
  # roles differ in their Dockerfile and in nothing else, and a copied job is
  # the place where the fifth profile gets forgotten. The Dockerfile name is
  # derived from the profile (Dockerfile.sandbox.<profile>) — the same rule the
  # catalogue in internal/sandbox states.
  layers:
    needs: base-manifest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dev-flutter, dev-php, dev-web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox.${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.base-manifest.outputs.ref }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      # Der doppelte Bindestrich trennt, und das ist keine Kosmetik: Mit
      # `digests-dev-amd64` zog das Manifest von `dev` per `digests-dev-*` auch
      # die Digests von `dev-flutter`, `dev-php`, `dev-web` und `dev-full` an
      # sich — ein Tag mit sechzehn Einträgen, aus dem sich jeder Host irgendein
      # Rollen-Image zog (#116). Ein Profilname kann Bindestriche enthalten, ein
      # DOPPELTER kommt darin nicht vor.
      - uses: actions/upload-artifact@v4
        with:
          name: digests--${{ matrix.profile }}--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  layer-manifest:
    needs: layers
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dev-flutter, dev-php, dev-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.profile }}--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$PROFILE-$GITHUB_REF_NAME $PROFILE-latest"
          else
            tags="$PROFILE-latest $PROFILE-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # Eine Architektur, ein Digest: Steht hier eine andere Zahl, ist
          # etwas eingesammelt worden, das nicht zu diesem Profil gehört —
          # genau so entstand das Tag mit sechzehn Einträgen (#116). Lieber
          # laut scheitern als ein Manifest veröffentlichen, aus dem sich jeder
          # Host etwas anderes zieht.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          docker buildx imagetools inspect "${image}:${PROFILE}-latest"

  # Stage 3: the all-rounder, which builds on `dev` and not on `base` — it is
  # dev plus the Flutter SDK. Hence its own stage: its base has to be published
  # before it can be built, and a matrix cannot express that ordering.
  #
  # A list rather than one entry, so that a second image on top of dev needs a
  # name here and nothing else. internal/sandbox knows which profiles those are
  # (their Dockerfile says ARG BASE_IMAGE=covey-sandbox-dev:latest), and a test
  # compares the two.
  full:
    needs: layer-manifest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev-full]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "base=${image}:dev-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "base=${image}:dev-latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox.${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests--${{ matrix.profile }}--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  full-manifest:
    needs: full
    strategy:
      fail-fast: false
      matrix:
        profile: [dev-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.profile }}--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$PROFILE-$GITHUB_REF_NAME $PROFILE-latest"
          else
            tags="$PROFILE-latest $PROFILE-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # Eine Architektur, ein Digest: Steht hier eine andere Zahl, ist
          # etwas eingesammelt worden, das nicht zu diesem Profil gehört —
          # genau so entstand das Tag mit sechzehn Einträgen (#116). Lieber
          # laut scheitern als ein Manifest veröffentlichen, aus dem sich jeder
          # Host etwas anderes zieht.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          docker buildx imagetools inspect "${image}:${PROFILE}-latest"

  # Der Katalog: welches Image zu welcher covey-Fassung gehört, gepinnt auf den
  # Digest (spec/16). Er entsteht HIER, weil nur diese Seite die Digests kennt —
  # eine Instanz soll nicht raten und nicht konfiguriert werden müssen.
  #
  # Auf einem eigenen Branch statt in main: Die Datei ändert sich bei jedem
  # Bau, und ein Bot, der dafür in den Hauptzweig committet, macht dessen
  # Historie unlesbar. `catalog` ist ein verwaister Branch — kein Quelltext,
  # eine Datei, ausgeliefert über raw.githubusercontent.
  # Der Katalog: welches Image zu welcher covey-Fassung gehört, gepinnt auf den
  # Digest (spec/16). Er entsteht HIER, weil nur diese Seite die Digests kennt —
  # eine Instanz soll nicht raten und nicht konfiguriert werden müssen.
  #
  # Auf einem eigenen Branch statt in main: Die Datei ändert sich bei jedem
  # Bau, und ein Bot, der dafür in den Hauptzweig committet, macht dessen
  # Historie unlesbar. `catalog` trägt keinen Quelltext, nur diese eine Datei,
  # ausgeliefert über raw.githubusercontent.
  catalog:
    needs: [base-manifest, layer-manifest, full-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Katalog schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          # Zwei Namen für denselben Stand, und sie sind NICHT dasselbe:
          #
          #   version  die covey-Fassung, unter der eine Instanz ihren Eintrag
          #            sucht — der Release-Tag, sonst "main"
          #            (sandbox.CatalogVersion()).
          #   imgtag   der Tag, unter dem das Image veröffentlicht wurde — der
          #            Release-Tag, sonst "latest" (siehe base-manifest oben).
          #
          # Sie gleichzusetzen hat diesen Job im ersten Lauf zerlegt: Er suchte
          # `base-main`, und das gibt es nicht.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            imgtag="$GITHUB_REF_NAME"
          else
            version="main"
            imgtag="latest"
          fi

          # Der Digest der Manifest-LISTE, nicht der einer Architektur: Ein
          # Host, der ihn zieht, bekommt die Architektur, auf der er steht.
          #
          # Die Reihenfolge ist die des Katalogs in internal/sandbox: base, die
          # Vereinigung, dann die Rollen. Wer hier ein Profil hinzufuegt, fuegt
          # es dort ebenfalls hinzu — sonst veroeffentlicht dieser Lauf ein
          # Image, das keine Instanz kennt.
          profiles="base dev dev-flutter dev-php dev-web dev-full"
          digests=""
          for p in $profiles; do
            d=$(docker buildx imagetools inspect "${image}:${p}-${imgtag}" --format '{{ .Manifest.Digest }}')
            digests="$digests $p=$d"
          done

          # Ein eigenes Verzeichnis: Dieser Branch hat mit dem Quelltext nichts
          # zu tun, und ein Checkout, in dem beides liegt, verwechselt das früher
          # oder später.
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin catalog 2>/dev/null; then
            git checkout -q -b catalog FETCH_HEAD
          else
            git checkout -q -b catalog
          fi

          # Bestehende Einträge anderer Fassungen bleiben stehen: Eine
          # Installation auf v0.4.0 muss ihren Eintrag noch finden, nachdem
          # v0.5.0 erschienen ist.
          python3 - "$version" "$imgtag" "$image" "$digests" <<'PY'
          import json, sys, datetime
          version, imgtag, image, digestliste = sys.argv[1:5]
          pfad = "sandbox-catalog.json"
          try:
              with open(pfad) as f:
                  cat = json.load(f)
          except FileNotFoundError:
              cat = {"schema": 1, "workplaces": []}

          # Kurzfassung der Beschreibung aus internal/sandbox/profiles.go. Sie
          # steht hier ein zweites Mal, weil der Katalog Instanzen erreicht, die
          # diesen Stand nicht compiliert haben — ein Profil, das eine aeltere
          # covey nicht kennt, wird trotzdem angeboten und braucht dafuer einen
          # Satz, der sagt, was darin liegt.
          beschreibung = {
              "base": "Node, git, chromium, ripgrep — enough for support, mail, QA and research agents.",
              "dev": "Everything from base plus PHP, JDK, fvm, uv and the node-gyp toolchain — the union, for an agent whose field is not settled.",
              "dev-flutter": "Base plus a Flutter SDK that is already in the image, fvm for projects that pin another version, and a JDK for Gradle.",
              "dev-php": "Base plus PHP 8.2 with the projects' extensions, Composer, a MariaDB to test against, and the node-gyp toolchain.",
              "dev-web": "Base plus the native build toolchain for npm packages — for Node and TypeScript projects.",
              "dev-full": "Every developer toolchain in one image, including the Flutter SDK — for an installation that would rather not split.",
          }
          label = {"dev-flutter": "dev · Flutter", "dev-php": "dev · PHP", "dev-web": "dev · Web",
                   "dev-full": "dev · Full stack"}
          digests = dict(t.split("=", 1) for t in digestliste.split())
          reihenfolge = [n for n in ("base", "dev", "dev-flutter", "dev-php", "dev-web", "dev-full") if n in digests]

          eintraege = {e["name"]: e for e in cat.get("workplaces", [])}
          for name in reihenfolge:
              digest = digests[name]
              e = eintraege.setdefault(name, {"name": name, "label": label.get(name, name),
                                              "description": beschreibung[name], "images": []})
              e["label"] = label.get(name, name)
              e["description"] = beschreibung[name]
              images = [i for i in e.get("images", []) if i.get("covey_version") != version]
              images.append({"covey_version": version, "ref": f"{image}@{digest}",
                             "tag": f"{name}-{imgtag}",
                             "platforms": ["linux/amd64", "linux/arm64"]})
              e["images"] = sorted(images, key=lambda i: i["covey_version"] != "main")
          cat["schema"] = 1
          cat["generated_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # Bestehende Eintraege anderer Profile bleiben stehen, auch wenn
          # dieser Lauf sie nicht gebaut hat.
          cat["workplaces"] = [eintraege[n] for n in reihenfolge] + [
              e for n, e in eintraege.items() if n not in reihenfolge]
          with open(pfad, "w") as f:
              json.dump(cat, f, indent=2)
              f.write("\n")
          PY

          git config user.name "covey-ci"
          git config user.email "ci@covey.invalid"
          git add sandbox-catalog.json
          if git diff --cached --quiet; then
            echo "Nichts zu committen — die Digests sind unverändert."
            exit 0
          fi
          git commit -q -m "catalog: $version —$digests"
          git push -q origin catalog
          echo "Katalog veröffentlicht:"
          cat sandbox-catalog.json
