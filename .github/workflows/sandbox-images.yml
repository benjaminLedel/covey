# Die Sandbox-Images, öffentlich gebaut und veröffentlicht.
#
# Warum hier und nicht in der GitLab-Seite: Die interne Pipeline baut sie in
# eine private Registry, an die kein Dritter kommt. Wer Covey von GitHub
# installiert, stand bis hierher vor einem `make sandbox-images` — zwei Images
# mit chromium, JDK und PHP, mehrere Gigabyte Bauzeit auf der eigenen Maschine,
# und beim Upgrade wieder. Eine Container-Installation hat dafür nicht einmal
# ein Repository. Betriebswerkzeug gehört ins Produkt, und ein fertiges Image
# ist hier das Produkt.
#
# EIN Package, die Varianten als Tag-Präfix (`base-…`, `dev-…`) statt zwei
# Packages: Sie werden zusammen gebaut, zusammen versioniert und zusammen
# gezogen — und eine Sichtbarkeit, die man einmal auf öffentlich stellt, ist
# eine weniger, die man vergessen kann.
#
# Zwei Architekturen auf je eigenem Runner statt per QEMU: Die Images
# installieren chromium, ein JDK und PHP über apt. Emuliert dauert das Stunden;
# GitHub stellt für öffentliche Repositories arm64-Runner bereit.
name: Sandbox images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Stufe 1: base je Architektur, gepusht per DIGEST und ohne Tag. Der Tag
  # entsteht erst in der Manifest-Stufe — sonst überschriebe die zweite
  # Architektur die erste, statt sich zu ihr zu gesellen.
  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für `git describe`, siehe unten
      - id: meta
        run: |
          set -eu
          echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: ${{ matrix.platform }}
          # Die Herkunft des coveyd im Image — `coveyd version` beantwortet
          # damit im Container, welcher Stand darin liegt.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          # Der Cache liegt an der Registry und nicht am Runner: Der nächste
          # Lauf zieht die Layer, die sich nicht geändert haben, statt chromium
          # noch einmal zu installieren.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  base-manifest:
    needs: base
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-base-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="base-$GITHUB_REF_NAME base-latest"
          else
            tags="base-latest base-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          echo "ref=${image}:base-latest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${image}:base-latest"

  # Stufe 2: dev auf dem gerade veröffentlichten base. Der Tag genügt als
  # BASE_IMAGE — die Registry liefert jedem Runner die Architektur, auf der er
  # steht, und so baut arm64 auf arm64 und amd64 auf amd64.
  dev:
    needs: base-manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox.dev
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.base-manifest.outputs.ref }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:dev-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:dev-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-dev-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  dev-manifest:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-dev-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="dev-$GITHUB_REF_NAME dev-latest"
          else
            tags="dev-latest dev-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          docker buildx imagetools inspect "${image}:dev-latest"

  # Der Katalog: welches Image zu welcher Covey-Fassung gehört, gepinnt auf den
  # Digest (spec/16). Er entsteht HIER, weil nur diese Seite die Digests kennt —
  # eine Instanz soll nicht raten und nicht konfiguriert werden müssen.
  #
  # Auf einem eigenen Branch statt in main: Die Datei ändert sich bei jedem
  # Bau, und ein Bot, der dafür in den Hauptzweig committet, macht dessen
  # Historie unlesbar. `catalog` ist ein verwaister Branch — kein Quelltext,
  # eine Datei, ausgeliefert über raw.githubusercontent.
  # Der Katalog: welches Image zu welcher Covey-Fassung gehört, gepinnt auf den
  # Digest (spec/16). Er entsteht HIER, weil nur diese Seite die Digests kennt —
  # eine Instanz soll nicht raten und nicht konfiguriert werden müssen.
  #
  # Auf einem eigenen Branch statt in main: Die Datei ändert sich bei jedem
  # Bau, und ein Bot, der dafür in den Hauptzweig committet, macht dessen
  # Historie unlesbar. `catalog` trägt keinen Quelltext, nur diese eine Datei,
  # ausgeliefert über raw.githubusercontent.
  catalog:
    needs: [base-manifest, dev-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Katalog schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="main"
          fi

          # Der Digest der Manifest-LISTE, nicht der einer Architektur: Ein
          # Host, der ihn zieht, bekommt die Architektur, auf der er steht.
          base_digest=$(docker buildx imagetools inspect "${image}:base-${version}" --format '{{ .Manifest.Digest }}')
          dev_digest=$(docker buildx imagetools inspect "${image}:dev-${version}" --format '{{ .Manifest.Digest }}')

          # Ein eigenes Verzeichnis: Dieser Branch hat mit dem Quelltext nichts
          # zu tun, und ein Checkout, in dem beides liegt, verwechselt das früher
          # oder später.
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin catalog 2>/dev/null; then
            git checkout -q -b catalog FETCH_HEAD
          else
            git checkout -q -b catalog
          fi

          # Bestehende Einträge anderer Fassungen bleiben stehen: Eine
          # Installation auf v0.4.0 muss ihren Eintrag noch finden, nachdem
          # v0.5.0 erschienen ist.
          python3 - "$version" "$image" "$base_digest" "$dev_digest" <<'PY'
          import json, sys, datetime
          version, image, base_digest, dev_digest = sys.argv[1:5]
          pfad = "sandbox-catalog.json"
          try:
              with open(pfad) as f:
                  cat = json.load(f)
          except FileNotFoundError:
              cat = {"schema": 1, "workplaces": []}

          beschreibung = {
              "base": "Node, git, chromium, ripgrep — enough for support, mail, QA and research agents.",
              "dev": "Everything from base plus PHP, JDK, fvm, uv and the node-gyp toolchain.",
          }
          digests = {"base": base_digest, "dev": dev_digest}

          eintraege = {e["name"]: e for e in cat.get("workplaces", [])}
          for name, digest in digests.items():
              e = eintraege.setdefault(name, {"name": name, "label": name,
                                              "description": beschreibung[name], "images": []})
              e["description"] = beschreibung[name]
              images = [i for i in e.get("images", []) if i.get("covey_version") != version]
              images.append({"covey_version": version, "ref": f"{image}@{digest}",
                             "tag": f"{name}-{version}",
                             "platforms": ["linux/amd64", "linux/arm64"]})
              e["images"] = sorted(images, key=lambda i: i["covey_version"] != "main")
          cat["schema"] = 1
          cat["generated_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          cat["workplaces"] = [eintraege[n] for n in ("base", "dev") if n in eintraege]
          with open(pfad, "w") as f:
              json.dump(cat, f, indent=2)
              f.write("\n")
          PY

          git config user.name "covey-ci"
          git config user.email "ci@covey.invalid"
          git add sandbox-catalog.json
          if git diff --cached --quiet; then
            echo "Nichts zu committen — die Digests sind unverändert."
            exit 0
          fi
          git commit -q -m "catalog: $version — base $base_digest, dev $dev_digest"
          git push -q origin catalog
          echo "Katalog veröffentlicht:"
          cat sandbox-catalog.json
