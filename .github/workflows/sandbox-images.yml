# The sandbox images, built and published in public.
#
# Why here and not on the GitLab side: the internal pipeline builds them into a
# private registry no third party reaches. Whoever installs covey from GitHub
# stood, up to here, in front of a `make sandbox-images` — images with
# chromium, JDK, PHP and a Flutter SDK, several gigabytes of build time on the
# own machine, and again on the upgrade. A container installation does not even
# have a repository for that. Operating tooling belongs in the product, and a
# finished image is the product here.
#
# ONE package, the variants as tag prefix (`base-…`, `dev-…`,
# `dev-flutter-…`) instead of one package per workplace: they are built
# together, versioned together and pulled together — and a visibility
# once set to public is one less to forget. That holds all the more
# since there are five of them.
#
# Two architectures on one runner each instead of via QEMU: the images install
# chromium, a JDK and PHP over apt. Emulated that takes hours; GitHub provides
# arm64 runners for public repositories.
name: Sandbox images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Stage 1: base per architecture, pushed by DIGEST and without a tag. The tag
  # only comes to be in the manifest stage — otherwise the second architecture
  # would overwrite the first instead of joining it.
  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for `git describe`, see below
      - id: meta
        run: |
          set -eu
          echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: ${{ matrix.platform }}
          # Where the coveyd in the image comes from — `coveyd version` answers
          # from inside the container which build stands in it.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          # The cache lies at the registry and not at the runner: the next run
          # pulls the layers that did not change, instead of installing chromium
          # once more.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:base-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests--base--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  base-manifest:
    needs: base
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--base--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="base-$GITHUB_REF_NAME base-latest"
          else
            tags="base-latest base-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # One architecture, one digest: if a different number stands here,
          # something was collected that does not belong to this profile — that
          # is exactly how the tag with sixteen entries came about (#116). Better
          # to fail loudly than to publish a manifest from which every host
          # pulls something different.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          echo "ref=${image}:base-latest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${image}:base-latest"

  # Stage 2: every workplace that builds on the base just published. The tag is
  # enough as BASE_IMAGE — the registry hands each runner the architecture it
  # stands on, so arm64 builds on arm64 and amd64 on amd64.
  #
  # One matrix over profile x architecture instead of a job per profile: the
  # roles differ in their Dockerfile and in nothing else, and a copied job is
  # the place where the fifth profile gets forgotten. The Dockerfile name is
  # derived from the profile (Dockerfile.sandbox.<profile>) — the same rule the
  # catalogue in internal/sandbox states.
  layers:
    needs: base-manifest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dev-flutter, dev-php, dev-web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox.${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.base-manifest.outputs.ref }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      # The double hyphen separates, and that is no cosmetic: with
      # `digests-dev-amd64` the manifest of `dev` pulled, via `digests-dev-*`, also
      # the digests of `dev-flutter`, `dev-php`, `dev-web` and `dev-full` to
      # itself — a tag with sixteen entries, from which every host grabbed some
      # role image (#116). A profile name can contain hyphens, a DOUBLE one does
      # not occur in it.
      - uses: actions/upload-artifact@v4
        with:
          name: digests--${{ matrix.profile }}--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  layer-manifest:
    needs: layers
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, dev-flutter, dev-php, dev-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.profile }}--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$PROFILE-$GITHUB_REF_NAME $PROFILE-latest"
          else
            tags="$PROFILE-latest $PROFILE-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # One architecture, one digest: if a different number stands here,
          # something was collected that does not belong to this profile — that
          # is exactly how the tag with sixteen entries came about (#116). Better
          # to fail loudly than to publish a manifest from which every host
          # pulls something different.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          docker buildx imagetools inspect "${image}:${PROFILE}-latest"

  # Stage 3: the all-rounder, which builds on `dev` and not on `base` — it is
  # dev plus the Flutter SDK. Hence its own stage: its base has to be published
  # before it can be built, and a matrix cannot express that ordering.
  #
  # A list rather than one entry, so that a second image on top of dev needs a
  # name here and nothing else. internal/sandbox knows which profiles those are
  # (their Dockerfile says ARG BASE_IMAGE=covey-sandbox-dev:latest), and a test
  # compares the two.
  full:
    needs: layer-manifest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev-full]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "base=${image}:dev-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "base=${image}:dev-latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox.${{ matrix.profile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:${{ matrix.profile }}-cache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest ablegen
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests--${{ matrix.profile }}--${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  full-manifest:
    needs: full
    strategy:
      fail-fast: false
      matrix:
        profile: [dev-full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.profile }}--*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags="$PROFILE-$GITHUB_REF_NAME $PROFILE-latest"
          else
            tags="$PROFILE-latest $PROFILE-$(echo "$GITHUB_SHA" | cut -c1-12)"
          fi
          # One architecture, one digest: if a different number stands here,
          # something was collected that does not belong to this profile — that
          # is exactly how the tag with sixteen entries came about (#116). Better
          # to fail loudly than to publish a manifest from which every host
          # pulls something different.
          n=$(ls -1 /tmp/digests | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "expected 2 digests (amd64, arm64), found $n:" >&2
            ls -1 /tmp/digests >&2
            exit 1
          fi
          args=""
          for d in /tmp/digests/*; do args="$args ${image}@sha256:$(basename "$d")"; done
          for t in $tags; do
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "${image}:${t}" $args
          done
          docker buildx imagetools inspect "${image}:${PROFILE}-latest"

  # The catalogue: which image belongs to which covey release, pinned on the
  # digest (spec/16). It comes to be HERE, because only this side knows the
  # digests — an instance should not have to guess and should not have to be configured.
  #
  # On a branch of its own instead of in main: the file changes with every
  # build, and a bot that commits for that into the main branch makes its
  # history unreadable. `catalog` is an orphaned branch — no source code,
  # one file, served over raw.githubusercontent.
  # The catalogue: which image belongs to which covey release, pinned on the
  # digest (spec/16). It comes to be HERE, because only this side knows the
  # digests — an instance should not have to guess and should not have to be configured.
  #
  # On a branch of its own instead of in main: the file changes with every
  # build, and a bot that commits for that into the main branch makes its
  # history unreadable. `catalog` carries no source code, only this one file,
  # served over raw.githubusercontent.
  catalog:
    needs: [base-manifest, layer-manifest, full-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Katalog schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image=$(echo "$REGISTRY/$GITHUB_REPOSITORY-sandbox" | tr 'A-Z' 'a-z')
          # Two names for the same build, and they are NOT the same:
          #
          #   version  the covey release under which an instance looks for its
          #            entry — the release tag, otherwise "main"
          #            (sandbox.CatalogVersion()).
          #   imgtag   the tag under which the image was published — the
          #            release tag, otherwise "latest" (see base-manifest above).
          #
          # Equating the two tore this job apart on its first run: it looked for
          # `base-main`, and that does not exist.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            imgtag="$GITHUB_REF_NAME"
          else
            version="main"
            imgtag="latest"
          fi

          # The digest of the manifest LIST, not of one architecture: a host
          # that pulls it gets the architecture it stands on.
          #
          # The order is the one of the catalogue in internal/sandbox: base, the
          # union, then the roles. Whoever adds a profile here adds it there too —
          # otherwise this run publishes an
          # image no instance knows.
          profiles="base dev dev-flutter dev-php dev-web dev-full"
          digests=""
          for p in $profiles; do
            d=$(docker buildx imagetools inspect "${image}:${p}-${imgtag}" --format '{{ .Manifest.Digest }}')
            digests="$digests $p=$d"
          done

          # A directory of its own: this branch has nothing to do with the source
          # code, and a checkout holding both mixes that up sooner
          # or later.
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin catalog 2>/dev/null; then
            git checkout -q -b catalog FETCH_HEAD
          else
            git checkout -q -b catalog
          fi

          # Existing entries of other releases stay in place: an
          # installation on v0.4.0 must still find its entry after
          # v0.5.0 has appeared.
          python3 - "$version" "$imgtag" "$image" "$digests" <<'PY'
          import json, sys, datetime
          version, imgtag, image, digestliste = sys.argv[1:5]
          pfad = "sandbox-catalog.json"
          try:
              with open(pfad) as f:
                  cat = json.load(f)
          except FileNotFoundError:
              cat = {"schema": 1, "workplaces": []}

          # Short form of the description from internal/sandbox/profiles.go. It
          # stands here a second time because the catalogue reaches instances that
          # did not compile this build — a profile an older
          # covey does not know is offered all the same and needs for that a
          # sentence saying what lies in it.
          beschreibung = {
              "base": "Node, git, chromium, ripgrep — enough for support, mail, QA and research agents.",
              "dev": "Everything from base plus PHP, JDK, fvm, uv and the node-gyp toolchain — the union, for an agent whose field is not settled.",
              "dev-flutter": "Base plus a Flutter SDK that is already in the image, fvm for projects that pin another version, and a JDK for Gradle.",
              "dev-php": "Base plus PHP 8.2 with the projects' extensions, Composer, a MariaDB to test against, and the node-gyp toolchain.",
              "dev-web": "Base plus the native build toolchain for npm packages — for Node and TypeScript projects.",
              "dev-full": "Every developer toolchain in one image, including the Flutter SDK — for an installation that would rather not split.",
          }
          label = {"dev-flutter": "dev · Flutter", "dev-php": "dev · PHP", "dev-web": "dev · Web",
                   "dev-full": "dev · Full stack"}
          digests = dict(t.split("=", 1) for t in digestliste.split())
          reihenfolge = [n for n in ("base", "dev", "dev-flutter", "dev-php", "dev-web", "dev-full") if n in digests]

          eintraege = {e["name"]: e for e in cat.get("workplaces", [])}
          for name in reihenfolge:
              digest = digests[name]
              e = eintraege.setdefault(name, {"name": name, "label": label.get(name, name),
                                              "description": beschreibung[name], "images": []})
              e["label"] = label.get(name, name)
              e["description"] = beschreibung[name]
              images = [i for i in e.get("images", []) if i.get("covey_version") != version]
              images.append({"covey_version": version, "ref": f"{image}@{digest}",
                             "tag": f"{name}-{imgtag}",
                             "platforms": ["linux/amd64", "linux/arm64"]})
              e["images"] = sorted(images, key=lambda i: i["covey_version"] != "main")
          cat["schema"] = 1
          cat["generated_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # Existing entries of other profiles stay in place, even when
          # this run did not build them.
          cat["workplaces"] = [eintraege[n] for n in reihenfolge] + [
              e for n, e in eintraege.items() if n not in reihenfolge]
          with open(pfad, "w") as f:
              json.dump(cat, f, indent=2)
              f.write("\n")
          PY

          git config user.name "covey-ci"
          git config user.email "ci@covey.invalid"
          git add sandbox-catalog.json
          if git diff --cached --quiet; then
            echo "Nichts zu committen — die Digests sind unverändert."
            exit 0
          fi
          git commit -q -m "catalog: $version —$digests"
          git push -q origin catalog
          echo "Katalog veröffentlicht:"
          cat sandbox-catalog.json
