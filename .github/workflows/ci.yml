# GitHub pipeline for covey.
#
# The repository sits on GitLab (there the full pipeline runs, including
# deploy) AND on GitHub — there it is the public face of the project.
# On GitHub nothing ran at all so far: whoever looks at the repository there saw
# not a single green checkmark.
#
# This pipeline checks the same as the GitLab side, without deploy: format,
# vet, tests, frontend, vulnerabilities. Postgres stands beside the Go job so
# that the integration suite RUNS here instead of skipping itself — without a
# database that job checks barely a third of what it claims to check (see
# internal/integration/stack_test.go).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a vulnerability entry that only became known NEWLY
  # is noticed without anyone pushing something.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The Go binary embeds web/dist via //go:embed — without this
      # artefact the Go job fails at the build, not at the code.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  go:
    runs-on: ubuntu-latest
    needs: frontend
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    # The integration suite creates a database of its own per test and throws
    # it away afterwards, so it needs a user allowed to CREATE DATABASE — the
    # image's superuser is exactly that. The pgvector image, because the
    # migrations create the `vector` extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: covey
          POSTGRES_PASSWORD: covey
          POSTGRES_DB: covey
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U covey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # check-latest: otherwise setup-go takes the version preinstalled on
      # the runner image as soon as it fits the "1.26" series — and that one
      # lags by one after every patch release. The run then fails on something
      # that is not in the source: govulncheck reports the standard library of
      # the build toolchain (go1.26.5 → five findings, all "Fixed in
      # go1.26.6"). The golang:1.26 images on the GitLab side pull the newest
      # patch on their own; here it has to be said.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # The settings the GitLab job passes to its service: no crash safety for
      # databases that live a few seconds. A service container here takes no
      # command line, so they are set on the running server instead — all
      # three take effect on a reload.
      - name: postgres without fsync
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U covey -d covey
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      # Formatting is a condition, not a matter of taste: unformatted
      # code makes every later diff larger than the change.
      - name: gofmt
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...) | tee /dev/stderr)"
      - run: go vet ./...
      # -coverpkg over our own package list: otherwise Go counts only what a
      # test covers in its OWN package, and the integration suite — which
      # drives half the server — would show as 0 %. The list comes from
      # `go list` rather than the pattern `./...`, because the pattern also
      # instruments pgx, chromedp and the rest of the module graph, which
      # would make half the number somebody else's code.
      - name: go test
      # -timeout is a FUSE, not a budget. go test cuts a package off after ten
      # minutes when nothing says otherwise, and that default knows nothing
      # about the machine it runs on: the integration package took 592 s here
      # in one run — eight seconds under the axe — and on the GitLab runner,
      # which does the same work at about a third of the speed, it went over
      # and took five pipelines and two days of deploys with it (#258). A
      # generous fuse still catches a genuine hang; a tight one catches a slow
      # afternoon.
        env:
          COVEY_TEST_DATABASE_URL: postgres://covey:covey@localhost:5433/covey?sslmode=disable
          # Every wait in the integration suite was calibrated on a developer
          # machine; a shared runner does the same work at a third of the speed
          # — the same package took 227 s on one run and 560 s on the next
          # (#244). The factor stretches those budgets here and nowhere else,
          # and costs nothing while the tests pass: a wait returns when its
          # condition holds, not when the timer runs out.
          COVEY_TEST_WAIT_FACTOR: "3"
        run: go test -timeout 45m -coverprofile=coverage.out -coverpkg="$(go list ./... | paste -sd, -)" ./...
      # The total is the number the README shows. `go tool cover` prints it as
      # the last line of its table; the awk cuts the percent sign off so the
      # badge job gets something it can compare.
      - name: Coverage
        id: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

  # The number the go job measured has to reach a place the README can point
  # at: GitLab renders a coverage badge of its own, but that installation is
  # private, and a log line inside a workflow run is not something a reader
  # opens. shields.io draws a badge from an `endpoint` JSON, so one file on a
  # public URL is the whole requirement.
  #
  # A job of its own, because this one holds `contents: write`: a token that
  # can write to the repository must not sit beside a test run that executes
  # code from a pull request. Here nothing but the two lines below runs, and
  # only after a push to main.
  badge:
    runs-on: ubuntu-latest
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Publish the coverage badge
        env:
          PCT: ${{ needs.go.outputs.coverage }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PCT"
          color=$(awk -v p="$PCT" 'BEGIN {
            if (p >= 90) print "brightgreen"
            else if (p >= 75) print "green"
            else if (p >= 65) print "yellow"
            else if (p >= 50) print "orange"
            else print "red"
          }')
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$color" > "$dir/coverage.json"
          cd "$dir"
          # An orphan branch carrying one file, force-pushed: it holds the
          # current number and nothing else, so there is no history to keep and
          # main stays free of a commit per merge.
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -qm "coverage: $PCT%"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" badges

  security:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      # check-latest as above — here it carries the weight: govulncheck also
      # checks the standard library of the toolchain this job builds with.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # govulncheck reports only what the own code actually CALLS — which is why
      # it is nearly free of false alarms and why it stands as a hard step.
      # Version pinned: a tool that comes fresh off the network at every run is
      # itself an entry point.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # gosec complements govulncheck: the one knows known gaps in
      # DEPENDENCIES, the other looks for patterns in the OWN code. With
      # an explicit rule list instead of "everything except…" — unfiltered,
      # gosec reports 120 findings here, and most of them are the purpose
      # of this program (the dev plugin EXECUTES shell commands, the
      # workplace READS files by path). A job that spits out 120 lines
      # gets clicked away.
      # -exclude-dir=.go comes up empty here (GOPATH sits under ~/go, so
      # outside the working directory) — but stands deliberately worded
      # the same as the GitLab side, where exactly that let the job walk
      # through the module cache for 15 minutes. Both pipelines check the
      # same thing, so with the same flags too.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet -exclude-dir=.go -include=G101,G102,G106,G107,G112,G114,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G601 ./...
