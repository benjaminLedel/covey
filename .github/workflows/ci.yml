# GitHub-Pipeline für covey.
#
# Das Repository liegt auf GitLab (dort läuft die vollständige Pipeline samt
# Deploy) UND auf GitHub — dort ist es das öffentliche Gesicht des Projekts.
# Auf GitHub lief bisher gar nichts: Wer das Repository dort ansieht, sah
# keinen einzigen grünen Haken.
#
# Diese Pipeline prüft dasselbe wie die GitLab-Seite, ohne Deploy: Format,
# Vet, Tests, Frontend, Schwachstellen. Postgres stands beside the Go job so
# that the integration suite RUNS here instead of skipping itself — without a
# database that job checks barely a third of what it claims to check (see
# internal/integration/stack_test.go).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Wöchentlich, damit ein NEU bekannt gewordener Schwachstellen-Eintrag
  # auffällt, ohne dass jemand etwas pusht.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # Das Go-Binary bettet web/dist per //go:embed ein — ohne dieses
      # Artefakt scheitert der Go-Job am Build, nicht am Code.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  go:
    runs-on: ubuntu-latest
    needs: frontend
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    # The integration suite creates a database of its own per test and throws
    # it away afterwards, so it needs a user allowed to CREATE DATABASE — the
    # image's superuser is exactly that. The pgvector image, because the
    # migrations create the `vector` extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: covey
          POSTGRES_PASSWORD: covey
          POSTGRES_DB: covey
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U covey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # check-latest: sonst nimmt setup-go die auf dem Runner-Image
      # vorinstallierte Fassung, sobald sie zur Reihe "1.26" passt — und die ist
      # nach jedem Patch-Release eine hinterher. Der Lauf faellt dann an etwas,
      # das nicht im Quelltext steht: govulncheck meldet die Standard-Library
      # des Build-Toolchains (go1.26.5 → fuenf Befunde, alle "Fixed in
      # go1.26.6"). Die golang:1.26-Images der GitLab-Seite holen den neuesten
      # Patch von sich aus; hier muss man es sagen.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # Formatierung ist eine Bedingung, keine Geschmacksfrage: unformatierter
      # Code macht jeden späteren Diff größer als die Änderung.
      - name: gofmt
        run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...) | tee /dev/stderr)"
      - run: go vet ./...
      # -coverpkg over our own package list: otherwise Go counts only what a
      # test covers in its OWN package, and the integration suite — which
      # drives half the server — would show as 0 %. The list comes from
      # `go list` rather than the pattern `./...`, because the pattern also
      # instruments pgx, chromedp and the rest of the module graph, which
      # would make half the number somebody else's code.
      - name: go test
        env:
          COVEY_TEST_DATABASE_URL: postgres://covey:covey@localhost:5433/covey?sslmode=disable
          # Every wait in the integration suite was calibrated on a developer
          # machine; a shared runner does the same work at a third of the speed
          # — the same package took 227 s on one run and 560 s on the next
          # (#244). The factor stretches those budgets here and nowhere else,
          # and costs nothing while the tests pass: a wait returns when its
          # condition holds, not when the timer runs out.
          COVEY_TEST_WAIT_FACTOR: "3"
        run: go test -coverprofile=coverage.out -coverpkg="$(go list ./... | paste -sd, -)" ./...
      # The total is the number the README shows. `go tool cover` prints it as
      # the last line of its table; the awk cuts the percent sign off so the
      # badge job gets something it can compare.
      - name: Coverage
        id: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

  # The number the go job measured has to reach a place the README can point
  # at: GitLab renders a coverage badge of its own, but that installation is
  # private, and a log line inside a workflow run is not something a reader
  # opens. shields.io draws a badge from an `endpoint` JSON, so one file on a
  # public URL is the whole requirement.
  #
  # A job of its own, because this one holds `contents: write`: a token that
  # can write to the repository must not sit beside a test run that executes
  # code from a pull request. Here nothing but the two lines below runs, and
  # only after a push to main.
  badge:
    runs-on: ubuntu-latest
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Publish the coverage badge
        env:
          PCT: ${{ needs.go.outputs.coverage }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PCT"
          color=$(awk -v p="$PCT" 'BEGIN {
            if (p >= 90) print "brightgreen"
            else if (p >= 75) print "green"
            else if (p >= 65) print "yellow"
            else if (p >= 50) print "orange"
            else print "red"
          }')
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$color" > "$dir/coverage.json"
          cd "$dir"
          # An orphan branch carrying one file, force-pushed: it holds the
          # current number and nothing else, so there is no history to keep and
          # main stays free of a commit per merge.
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -qm "coverage: $PCT%"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" badges

  security:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      # check-latest wie oben — hier trägt es die Last: govulncheck prüft die
      # Standard-Library des Toolchains mit, mit dem dieser Job baut.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # govulncheck meldet nur, was der eigene Code tatsächlich AUFRUFT —
      # deshalb praktisch ohne Fehlalarme und deshalb als harter Schritt.
      # Version gepinnt: Ein Werkzeug, das bei jedem Lauf frisch aus dem Netz
      # kommt, ist selbst ein Einfallstor.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # gosec ergänzt govulncheck: Das eine kennt bekannte Lücken in
      # ABHÄNGIGKEITEN, das andere sucht Muster im EIGENEN Code. Mit einer
      # ausdrücklichen Regel-Liste statt „alles außer…" — ungefiltert meldet
      # gosec hier 120 Befunde, und die Masse davon ist der Zweck dieses
      # Programms (der dev-Plugin FÜHRT Shell-Befehle aus, der Arbeitsplatz
      # LIEST Dateien nach Pfad). Ein Job, der 120 Zeilen ausspuckt, wird
      # weggeklickt.
      # -exclude-dir=.go greift hier ins Leere (GOPATH liegt unter ~/go, also
      # ausserhalb des Arbeitsverzeichnisses) — steht aber bewusst gleichlautend
      # zur GitLab-Seite, wo genau das den Job 15 Minuten lang durch den
      # Modul-Cache laufen liess. Beide Pipelines pruefen dasselbe, also auch
      # mit denselben Flags.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet -exclude-dir=.go -include=G101,G102,G106,G107,G112,G114,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G601 ./...
