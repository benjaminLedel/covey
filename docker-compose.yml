# covey — the setup for trying it out.
#
#   1. cp .env.example .env
#   2. echo "COVEY_MASTER_KEY=$(openssl rand -hex 32)" >> .env   # 32-byte key
#   3. make sandbox-images-pull   # the agents' workplaces, once, minutes
#      (base for support/mail/QA, dev for developer agents, a role workplace
#       each for Flutter, PHP and web, and dev-full with all of it in one
#       image — docs/en/operations/workplaces.md)
#   4. docker compose up -d --build
#   5. http://localhost:8494  →  admin@covey.local / covey-admin
#
# Contains everything covey needs: Postgres (pgvector) and the covey binary with
# its embedded admin UI. `bootstrap` creates the organisation, the admin, a demo
# agent and its workplace once; after that `covey serve` starts (migrations run
# automatically).
#
# Step 3 is the one that is easy to skip and impossible to do without: agents
# work inside their own container, and that image is not part of this build. It
# is deliberately separate — it carries chromium, a JDK and a Node toolchain and
# takes minutes, while everything else here takes seconds. Skip it and the
# platform starts, the interface works, and the first wake fails at
# "sandbox image is missing". `covey serve` says so at startup, and the first
# steps on the agent overview say so too.

# Shared base for bootstrap + covey (same image, same config).
x-covey-base: &covey-base
  build: .
  # Instead of `build: .` a ready-made image can be used (registry access
  # required):
  # image: registry.lapco.legal/private_bl/covey:latest
  environment:
    COVEY_DATABASE_URL: postgres://covey:covey@db:5432/covey?sslmode=disable
    COVEY_MASTER_KEY: ${COVEY_MASTER_KEY:?set it in .env — e.g. echo "COVEY_MASTER_KEY=$(openssl rand -hex 32)" >> .env}
    COVEY_PUBLIC_URL: ${COVEY_PUBLIC_URL:-http://localhost:8494}
    COVEY_LISTEN_ADDR: ":8494"
    # The data directory has the SAME path on the host and in the container, and
    # that is not cosmetic: sandboxes run as sibling containers, so the `-v` path
    # for an agent's home is resolved by the host's Docker daemon. A named volume
    # or a differing path would produce a mount that exists nowhere, and the
    # agent would find an empty home on every wake.
    COVEY_DATA_DIR: ${PWD}/data
    COVEY_ADMIN_EMAIL: ${COVEY_ADMIN_EMAIL:-admin@covey.local}
    COVEY_ADMIN_PASSWORD: ${COVEY_ADMIN_PASSWORD:-covey-admin}
    COVEY_SANDBOX_IMAGE: ${COVEY_SANDBOX_IMAGE:-covey-sandbox:latest}
    # The second workplace (profile `dev`). Existing agents were put there by
    # the upgrade, because the image from before the split carried exactly what
    # `dev` adds. Whoever still has that old image points this at it instead of
    # building a second one.
    COVEY_SANDBOX_IMAGE_DEV: ${COVEY_SANDBOX_IMAGE_DEV:-covey-sandbox-dev:latest}
    # The role workplaces resolve from the published catalogue on their own.
    # Overriding one means adding its line here — COVEY_SANDBOX_IMAGE_<PROFILE>,
    # hyphens as underscores (COVEY_SANDBOX_IMAGE_DEV_FLUTTER) — because compose
    # passes on only what is written down.
  volumes:
    - ${PWD}/data:${PWD}/data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: covey
      POSTGRES_PASSWORD: covey
      POSTGRES_DB: covey
    volumes:
      - covey-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covey -d covey"]
      interval: 5s
      timeout: 5s
      retries: 15

  # One-off init: organisation + admin + demo agent + workplace (idempotent, runs
  # harmlessly on every `up`). Exits afterwards.
  bootstrap:
    <<: *covey-base
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # The control plane: API + orchestrator + embedded admin UI.
  covey:
    <<: *covey-base
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8494:8494"
    # A YAML merge replaces lists wholesale — hence both mounts spelled out here:
    # the data directory (as in the base) plus the Docker socket. The socket is
    # what lets the control plane start a sandbox per agent as a sibling
    # container; without it every wake fails at "no Docker daemon reachable".
    volumes:
      - ${PWD}/data:${PWD}/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  covey-db:
