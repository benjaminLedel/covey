# GitLab CI for covey.
#
# Pipeline: test → build → deploy.
# - test:  govulncheck (dependencies against the Go vulnerability database),
#          frontend tests + build (web/dist must exist for //go:embed),
#          then the gofmt check, go vet and go test.
#          go test runs with -coverprofile: GitLab gets the overall percentage
#          as a badge (coverage regex) and a Cobertura report for the
#          MR diff coverage view.
#          The integration tests skip automatically, because no Postgres is
#          reachable on localhost:5433 in CI (see internal/integration/stack_test.go).
# - build: build the Docker image from the multi-stage Dockerfile via docker:dind
#          and push it to the GitLab Container Registry ($CI_REGISTRY_IMAGE).
#
# Tags: every push to a branch → :$CI_COMMIT_SHORT_SHA,
#       default branch additionally → :latest,
#       Git tags additionally → :$CI_COMMIT_TAG.
#
# dind runs without TLS (DOCKER_TLS_CERTDIR="") on tcp://docker:2375 -- the same
# configuration that works in the feeval project on the same runner.
#
# - deploy: after every push to main, roll out the image just built (pinned to
#           the commit tag :$CI_COMMIT_SHORT_SHA) on the target host. Runs on a
#           shell runner ON the host (tag `covey-deploy`): copies
#           docker-compose.deploy.yml into the deploy folder and starts
#           `docker compose pull && up -d`. Secrets live in a persistent
#           `.env` in the deploy folder (created once, never overwritten).

workflow:
  rules:
    # No duplicate pipelines: with an open MR, only the MR pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# The rule above only bites when the merge request already exists at push time.
# Push first and open the merge request a minute later -- which is the normal
# order -- and both pipelines run. The branch one then sits in the queue, the
# merge request is merged with its source branch removed, and ten minutes later
# a runner picks up a job whose ref is gone:
#
#     fatal: couldn't find remote ref refs/heads/<branch>
#
# Four red pipelines in one afternoon that way, none of them about the code.
# interruptible lets GitLab cancel a superseded pipeline instead of running it
# into a deleted branch. It needs "auto-cancel redundant pipelines" switched on
# in the project settings; the flag alone does nothing.
default:
  interruptible: true

stages:
  - test
  - build
  - deploy

security:
  stage: test
  image: golang:1.26
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    # Version pinned instead of @latest: a tool pulled fresh off the net on every
    # run is itself an entry point -- a compromised release would run in the
    # pipeline unasked, with access to its environment. Pinning costs one
    # Dependabot update per quarter.
    # govulncheck checks the dependencies against the Go vulnerability database
    # -- and for REACHABILITY: it reports only what our own code actually
    # calls. Hence almost no false positives, hence a hard step and not a report
    # nobody reads.
    # (A finding in a module we only import but never call deliberately leaves
    # the job green -- otherwise it would be switched off after the first week.)
    - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
    # gosec complements govulncheck: one knows known gaps in
    # DEPENDENCIES, the other looks for patterns in OUR OWN code.
    #
    # Deliberately with an explicit rule LIST instead of "everything except":
    # unfiltered gosec reports 120 findings here, and most of them are the
    # purpose of this program -- the dev plugin RUNS shell commands (G204),
    # the workplace READS files by path (G304), the sandbox homes
    # need their permissions (G301). A job that spits out 120 lines gets
    # dismissed after two weeks.
    # This list holds the rules we actually react to; a new one joins when
    # it proves to say something.
    #
    # As of now: 0 findings. If this goes red, it is serious.
    #
    # -exclude-dir=.go is not cosmetics here, it is required: GOPATH points
    # above at $CI_PROJECT_DIR/.go so that GitLab can keep the module cache
    # between runs (cache paths have to lie inside the project
    # directory). But gosec resolves ./... through the filesystem, not through
    # `go list` -- and so walked through every foreign dependency under
    # .go/pkg/mod: 6167 files, 2.7M lines, 320 findings, none of them
    # in our own code, in exchange 15 minutes of runtime and exit 1. The same
    # trap that the gofmt line in test-go already wards itself off with `go list`.
    - go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet -exclude-dir=.go -include=G101,G102,G106,G107,G112,G114,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G601 ./...

build-web:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    # Tests first, then the build: a bundle that gets built although the UI is
    # provably broken only costs time and hides the finding. `npm run build`
    # runs `tsc -b` anyway.
    - npm test
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 hour

test-go:
  stage: test
  image: golang:1.26
  needs:
    - build-web
  # Postgres beside the job, so that the integration suite RUNS. Without it
  # the larger part of the tests skipped itself silently
  # (internal/integration/stack_test.go skips when no database answers) and
  # the coverage badge showed barely a third of what the suite actually
  # covers. The pgvector image, because the migrations create the `vector`
  # extension; the image's superuser, because every test creates a database
  # of its own and throws it away afterwards.
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      # No crash safety for databases that live a few seconds. Every test
      # creates one and drops it again; fsync, full-page writes and a
      # synchronous commit per statement protect data nobody will ever read
      # back, on the slowest disk this pipeline has.
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    POSTGRES_USER: covey
    POSTGRES_PASSWORD: covey
    POSTGRES_DB: covey
    # In the docker executor the service answers under its alias, not under
    # localhost — and on its own port 5432 rather than the 5433 that
    # `make dev-db` forwards locally.
    COVEY_TEST_DATABASE_URL: postgres://covey:covey@postgres:5432/covey?sslmode=disable
    # Every wait in the integration suite was calibrated on a developer
    # machine; a shared runner does the same work at a third of the speed —
    # the same package took 227 s on one run and 560 s on the next (#244). The
    # factor stretches those budgets here and nowhere else. It costs nothing
    # while the tests pass: a wait returns when its condition holds, not when
    # the timer runs out.
    COVEY_TEST_WAIT_FACTOR: "3"
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    # Formatting is not a matter of taste: unformatted code makes every later
    # diff bigger than the change it carries. gofmt -l names the offenders
    # (tee shows them in the job log), test -z fails the job as soon as the list
    # is not empty. The paths come from `go list` so that the module cache under
    # $GOPATH is not checked along with them.
    - test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...) | tee /dev/stderr)"
    - go vet ./...
    # Measure coverage across all packages: -coverpkg also counts lines covered
    # from the tests of other packages (otherwise only package-local).
    #
    # The package list comes from `go list` instead of the pattern `./...`: as a
    # pattern, -coverpkg also instrumented the dependencies. The profile ended up
    # with 673 files, only 119 of them from covey/ — the rest chromedp, pgx and
    # company. That pushed the badge down to 14.3 % while our own code
    # actually sits at ~29 %. A metric that measures foreign code for half of it
    # is no use as a trend.
    # The output is written along, because a failed job otherwise leaves nothing
    # readable behind: coverage.txt and coverage.xml are produced in steps AFTER
    # this line, so a red run never reaches them. When a test went flaky on
    # main, it was no longer possible to tell afterwards which one — the trace is
    # the only place where it stood.
    #
    # Written to a file, not through a pipe: `... | tee` would return the exit
    # code of tee and a red test would come out as a green job. That would be
    # the worse of the two errors.
    # `set -o pipefail` would solve it -- and dash does not know it, so the
    # line would drop the job as soon as the runner does not pick bash. The
    # redirection needs neither.
    #
    # -timeout is a SAFETY NET, not a budget. Without it `go test` cuts a
    # package off after ten minutes, and that default knows nothing about
    # the machine: since #239 brings its own database, the integration
    # suite REALLY runs here -- 592 s on GitHub, eight seconds under the axe, and
    # on this runner, which does the same work at about a third of the speed,
    # above it. Five red pipelines and two days without deploy went by (#258),
    # without anyone seeing it: GitHub was green.
    - if ! go test -timeout 45m -coverprofile=coverage.out -coverpkg="$(go list ./... | paste -sd, -)" ./... > test.log 2>&1; then cat test.log; exit 1; fi
    - cat test.log
    # Overall percentage for the GitLab coverage badge (see coverage regex below).
    - go tool cover -func=coverage.out | tee coverage.txt
    # Cobertura report for the MR diff coverage view in GitLab.
    # v1.5.0 instead of v1.3.0: the latter pulls golang.org/x/tools v0.8.0 along,
    # and that cannot be compiled with Go 1.26 any more ("invalid array
    # length -delta * delta"). The job failed at this last line because of it --
    # after green tests, which is why GitLab still showed the coverage value.
    - go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml
  # GitLab reads the overall coverage from the output of `go tool cover -func`
  # (last line "total: … 42.7%") and shows it as a badge/trend.
  coverage: '/^total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    # when: always -- the failure is the only case in which somebody
    # looks for the test log, and the default (on_success) throws it
    # away exactly then.
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.txt
      - test.log
    expire_in: 1 week

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    # dind without TLS: empty CERTDIR => daemon listens on tcp://docker:2375
    # (plain), DOCKER_HOST points the client there explicitly. Without these two
    # lines the daemon (with TLS CERTDIR) sits on 2376, but the client defaults
    # to 2375 => "Cannot connect to the Docker daemon at tcp://docker:2375".
    # Proven in the feeval project on the same runner.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    # Write the origin into the binary (internal/buildinfo): the image has no
    # .git, so the CI tag/commit/build time pass through as build args.
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        --build-arg "COMMIT=$CI_COMMIT_SHORT_SHA"
        --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    # On MRs only build (smoke test), not push -- registry permission is often missing.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# This pipeline does NOT build the sandbox images any more.
#
# They were created here for the private registry, and the deploy pinned the
# instance to it via an environment variable. That cost two jobs and around
# twenty minutes per run -- and it excluded every host that does not have the
# credentials to this registry. That is exactly what surfaced with the first
# own runner: `denied: access forbidden` while pulling the dev workplace ahead.
#
# They are built and published in .github/workflows/sandbox-images.yml
# -- on every push to main and for every tag, public on ghcr, pinned in the
# catalogue by digest (spec/16). main goes to both remotes, so the
# catalogue entry `main` tracks the same commits.

# Rolls out the image that was just built on the target host. Requirement: a
# GitLab runner with the `shell` executor runs ON the target host and is
# registered with the tag `covey-deploy`; Docker + the Compose plugin are installed there.
#
# Configurable through CI/CD variables (Settings → CI/CD → Variables):
#   DEPLOY_DIR         target folder on the host (default /opt/covey)
#   COVEY_PUBLIC_URL   public URL (written into the .env only on the FIRST
#                      deploy; maintain it there afterwards)
deploy:
  stage: deploy
  # Explicitly NOT interruptible, against the default above. This job stops the
  # containers, writes the backup and runs the migrations; cancelled halfway it
  # leaves an instance in a state nobody chose. GitLab also only cancels a
  # pipeline while every running job in it is interruptible -- so this one line
  # protects the whole deploy stage once it has started.
  interruptible: false
  tags:
    - covey-deploy
  needs:
    - build-image
  variables:
    DEPLOY_DIR: /opt/covey
    GIT_STRATEGY: fetch
  script:
    - mkdir -p "$DEPLOY_DIR"
    # The Compose file is versioned config → update it on every deploy.
    - cp docker-compose.deploy.yml "$DEPLOY_DIR/docker-compose.yml"
    # Secrets live in a persistent .env in the deploy folder. Create it once on
    # the first deploy (master key + passwords random), afterwards NEVER
    # touch it -- a master key change makes all stored secrets unreadable.
    - |
      if [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "Kein .env in $DEPLOY_DIR — erzeuge einmalig frische Konfiguration."
        ( umask 077
          {
            echo "COVEY_MASTER_KEY=$(openssl rand -hex 32)"
            echo "COVEY_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "COVEY_ADMIN_EMAIL=admin@covey.local"
            echo "COVEY_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "COVEY_PUBLIC_URL=${COVEY_PUBLIC_URL:-http://localhost:8494}"
          } > "$DEPLOY_DIR/.env" )
        echo "WICHTIG: $DEPLOY_DIR/.env sichern — enthält den Master-Key. Admin-Passwort steht dort."
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Clear old images away, BEFORE the new one is pulled. The host carries the
    # covey image per deploy plus the workplace images from the catalogue
    # (over 2 GB with Chromium) -- without clearing, the disk runs full and the
    # pull fails with "no space left on device" (as happened in pipeline
    # 539).
    #
    # `until=24h` leaves everything of today standing: the image just running,
    # the rollback targets of the recent deploys and above all the current
    # sandbox image, which hangs on NO running container (sandboxes are
    # ephemeral) and would otherwise be taken along by `prune -a`. Volumes are
    # never touched -- the database lies there.
    - docker system df || true
    - docker image prune -af --filter "until=24h" || true
    - docker system df || true
    # Pin the image to the immutable commit tag ("special tag").
    - export COVEY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # This job does NOT pin the workplace images any more. They come from the
    # published catalogue (spec/16), per covey version by digest,
    # public on ghcr -- and a runner pulls what it lacks. Before, the deploy
    # pulled them up front, because the covey container has no credentials for
    # the private registry; with the first own runner that turned into an
    # exclusion, since the host does not have them either and should not get
    # them. A public image resolves both.
    - echo "Deploye $COVEY_IMAGE nach $DEPLOY_DIR (Arbeitsplaetze aus dem Katalog)"
    - cd "$DEPLOY_DIR"
    # Also persist the current image tags in the .env: only that way do manual
    # compose commands on the host (e.g.
    # `docker compose run --rm covey passwd …`) work without exported variables.
    # The secrets in the .env stay untouched; during the CI run itself
    # the shell environment still wins over the .env interpolation.
    - |
      for var in COVEY_IMAGE; do
        val=$(printenv "$var")
        if grep -q "^$var=" .env; then
          sed -i "s|^$var=.*|$var=$val|" .env
        else
          echo "$var=$val" >> .env
        fi
      done
      # And remove the workplace lines of earlier deploys ACTIVELY: a set
      # variable beats the catalogue, so a forgotten line in the
      # .env would be yesterday's deploy overriding today's.
      sed -i "/^COVEY_SANDBOX_IMAGE=/d;/^COVEY_SANDBOX_IMAGE_DEV=/d" .env
    # Backup, BEFORE starting up -- because `up -d` runs the migrations,
    # and that is the one moment in which one would have wanted to have one.
    #
    # Two things, and both are needed: the database knows the manifests of the
    # home snapshots, the blocks under data/blocks know their content. Whoever
    # backs up only one has, after a disk failure, either a directory without an
    # assignment or an assignment without content. Measured on a real
    # developer home: 7 GB, of which 48 MB exist nowhere else (spec/16).
    #
    # Best effort and explicitly not blocking: a deploy that fails at its own
    # backup leaves an instance at a state nobody wanted. What went wrong stands
    # in the job log.
    - |
      set +e
      backups="$DEPLOY_DIR/backups"
      mkdir -p "$backups"
      stamp=$(date -u +%Y%m%d-%H%M%S)
      if docker compose ps db --status running 2>/dev/null | grep -q db; then
        echo "Sichere Datenbank nach $backups/db-$stamp.sql.gz"
        docker compose exec -T db pg_dump -U covey covey | gzip > "$backups/db-$stamp.sql.gz" \
          || echo "WARNUNG: Datenbank-Dump fehlgeschlagen — Deploy läuft weiter."
      else
        echo "Kein laufender db-Container — erster Deploy, nichts zu sichern."
      fi
      blocks="${COVEY_DATA_DIR:-/opt/covey/data}/blocks"
      if [ -d "$blocks" ]; then
        # The block store belongs to root and is mode 700; this job runs as the
        # shell runner's own user and cannot read a single file in it. Tarring
        # from here produced a 45-byte archive with no entries — one that
        # rotated along with the others and looked like a backup in the listing
        # until somebody needed it (pipeline 871).
        #
        # So a throwaway container reads it as root and writes to stdout, which
        # this shell redirects — that keeps the file owned by the runner, like
        # the database dump beside it.
        #
        # busybox instead of the sandbox image: this stood here because that
        # image was pulled anyway. Since the workplaces come from the
        # catalogue, it no longer sits on the host by necessity — and a backup
        # should not hang on a download of several gigabytes. busybox brings
        # tar and weighs two megabytes.
        #
        # --user 0:0 carries weight: the block directory belongs to root and is 700.
        echo "Sichere Blockspeicher nach $backups/blocks-$stamp.tar.gz"
        docker run --rm --user 0:0 --entrypoint tar \
          -v "$blocks:/blocks:ro" busybox:1.36 \
          -czf - -C / blocks > "$backups/blocks-$stamp.tar.gz" \
          || echo "WARNUNG: Blocksicherung fehlgeschlagen — Deploy läuft weiter."
        # An empty backup is worse than none: it takes a retention slot, looks
        # right in the listing and fails only when it is needed. Whatever went
        # wrong, what must not remain is a file that claims to be a backup.
        if ! tar -tzf "$backups/blocks-$stamp.tar.gz" 2>/dev/null | head -1 | grep -q .; then
          echo "FEHLER: Blocksicherung ist leer oder unlesbar — wird entfernt, damit sie niemand für eine Sicherung hält."
          rm -f "$backups/blocks-$stamp.tar.gz"
        else
          echo "Blocksicherung: $(du -h "$backups/blocks-$stamp.tar.gz" | cut -f1)"
        fi
      fi
      # Three copies per kind. More would be a retention nobody chose, on a
      # disk that also carries the sandbox images.
      ls -1t "$backups"/db-*.sql.gz 2>/dev/null | tail -n +4 | xargs -r rm -f
      ls -1t "$backups"/blocks-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f
      df -h "$backups" | tail -1
      set -e
    # COVEY_IMAGE comes from the shell environment (overwrites .env interpolation),
    # Compose reads every secret from the .env in the folder automatically.
    - docker compose pull
    - docker compose up -d --remove-orphans
    - docker compose ps
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
