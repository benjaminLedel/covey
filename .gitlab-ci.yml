# GitLab CI für Covey.
#
# Pipeline: test → build.
# - test:  Frontend bauen (web/dist muss für //go:embed existieren), dann go vet + go test.
#          Die Integrationstests skippen automatisch, weil in der CI kein Postgres
#          auf localhost:5433 erreichbar ist (siehe internal/integration/stack_test.go).
# - build: Docker-Image aus dem Multi-Stage-Dockerfile bauen und in die
#          GitLab Container Registry pushen ($CI_REGISTRY_IMAGE).
#
# Tags: jeder Push auf einen Branch → :$CI_COMMIT_SHORT_SHA,
#       Default-Branch zusätzlich → :latest,
#       Git-Tags zusätzlich → :$CI_COMMIT_TAG.
#
# Voraussetzung: ein Runner, der Docker-in-Docker kann (privileged) —
# alternativ den build-image-Job auf Kaniko/Buildah umstellen.

workflow:
  rules:
    # Keine doppelten Pipelines: bei offenem MR nur die MR-Pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build

build-web:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 hour

test-go:
  stage: test
  image: golang:1.26
  needs:
    - build-web
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    - go vet ./...
    - go test ./...

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    # Standard-Setup für docker:dind mit TLS (GitLab-Doku); der Runner muss
    # privileged sein und /certs/client als Volume teilen.
    DOCKER_TLS_CERTDIR: "/certs"
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    # Auf MRs nur bauen (Smoke-Test), nicht pushen — dort fehlt oft das Registry-Recht.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
