# GitLab CI für Covey.
#
# Pipeline: test → build.
# - test:  Frontend bauen (web/dist muss für //go:embed existieren), dann go vet + go test.
#          go test läuft mit -coverprofile: GitLab bekommt den Gesamt-Prozentwert
#          als Badge (coverage-Regex) und einen Cobertura-Report für die
#          MR-Diff-Coverage-Anzeige.
#          Die Integrationstests skippen automatisch, weil in der CI kein Postgres
#          auf localhost:5433 erreichbar ist (siehe internal/integration/stack_test.go).
# - build: Docker-Image aus dem Multi-Stage-Dockerfile via docker:dind bauen
#          und in die GitLab Container Registry pushen ($CI_REGISTRY_IMAGE).
#
# Tags: jeder Push auf einen Branch → :$CI_COMMIT_SHORT_SHA,
#       Default-Branch zusätzlich → :latest,
#       Git-Tags zusätzlich → :$CI_COMMIT_TAG.
#
# dind läuft ohne TLS (DOCKER_TLS_CERTDIR="") auf tcp://docker:2375 — dieselbe
# Konfiguration, die im feeval-Projekt auf demselben Runner funktioniert.
#
# - deploy: Nach jedem main-Push das gerade gebaute Image (auf den Commit-Tag
#           :$CI_COMMIT_SHORT_SHA gepinnt) auf dem Zielhost ausrollen. Läuft auf
#           einem Shell-Runner AM Host (Tag `covey-deploy`): kopiert
#           docker-compose.deploy.yml in den Deploy-Ordner und startet
#           `docker compose pull && up -d`. Secrets liegen in einer persistenten
#           `.env` im Deploy-Ordner (einmalig erzeugt, nie überschrieben).

workflow:
  rules:
    # Keine doppelten Pipelines: bei offenem MR nur die MR-Pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - deploy

build-web:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 hour

test-go:
  stage: test
  image: golang:1.26
  needs:
    - build-web
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    - go vet ./...
    # Coverage über alle Pakete messen: -coverpkg=./... zählt auch Zeilen, die
    # aus Tests anderer Pakete heraus abgedeckt werden (sonst nur paket-lokal).
    - go test -coverprofile=coverage.out -coverpkg=./... ./...
    # Gesamt-Prozentwert für den GitLab-Coverage-Badge (siehe coverage-Regex unten).
    - go tool cover -func=coverage.out | tee coverage.txt
    # Cobertura-Report für die MR-Diff-Coverage-Anzeige in GitLab.
    - go run github.com/boumenot/gocover-cobertura@latest < coverage.out > coverage.xml
  # GitLab liest den Gesamt-Coverage aus der Ausgabe von `go tool cover -func`
  # (letzte Zeile "total: … 42.7%") und zeigt ihn als Badge/Trend an.
  coverage: '/^total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.txt
    expire_in: 1 week

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    # dind ohne TLS: leeres CERTDIR => Daemon lauscht auf tcp://docker:2375
    # (plain), DOCKER_HOST zeigt den Client explizit dorthin. Ohne diese zwei
    # Zeilen liegt der Daemon (mit TLS-CERTDIR) auf 2376, der Client defaultet
    # aber auf 2375 => "Cannot connect to the Docker daemon at tcp://docker:2375".
    # Erprobt im feeval-Projekt auf demselben Runner.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    # Herkunft ins Binary schreiben (internal/buildinfo): im Image gibt es kein
    # .git, also reicht die CI Tag/Commit/Bauzeit als Build-Args durch.
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        --build-arg "COMMIT=$CI_COMMIT_SHORT_SHA"
        --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    # Auf MRs nur bauen (Smoke-Test), nicht pushen — dort fehlt oft das Registry-Recht.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Sandbox-Image (coveyd + Claude-Code-Runtime, Dockerfile.sandbox) für den
# docker-SandboxProvider. Gleiche Tag-Logik wie build-image, eigener
# Registry-Pfad :$CI_REGISTRY_IMAGE/sandbox.
build-sandbox-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE/sandbox:latest" || true
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE/sandbox:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        --build-arg "COMMIT=$CI_COMMIT_SHORT_SHA"
        --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --file Dockerfile.sandbox
        --tag "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Sandbox-Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/sandbox:latest"
        docker push "$CI_REGISTRY_IMAGE/sandbox:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Rollt das gerade gebaute Image auf dem Zielhost aus. Voraussetzung: ein
# GitLab-Runner mit Executor `shell` läuft AUF dem Zielhost und ist mit dem Tag
# `covey-deploy` registriert; Docker + Compose-Plugin sind dort installiert.
#
# Konfigurierbar über CI/CD-Variablen (Settings → CI/CD → Variables):
#   DEPLOY_DIR         Zielordner auf dem Host (Default /opt/covey)
#   COVEY_PUBLIC_URL   öffentliche URL (nur beim ERSTEN Deploy in die .env
#                      geschrieben; danach dort pflegen)
deploy:
  stage: deploy
  tags:
    - covey-deploy
  needs:
    - build-image
    - build-sandbox-image
  variables:
    DEPLOY_DIR: /opt/covey
    GIT_STRATEGY: fetch
  script:
    - mkdir -p "$DEPLOY_DIR"
    # Compose-Datei ist versionierte Config → bei jedem Deploy aktualisieren.
    - cp docker-compose.deploy.yml "$DEPLOY_DIR/docker-compose.yml"
    # Secrets liegen in einer persistenten .env im Deploy-Ordner. Beim ersten
    # Deploy einmalig erzeugen (Master-Key + Passwörter zufällig), danach NIE
    # anfassen — ein Master-Key-Wechsel macht alle hinterlegten Secrets unlesbar.
    - |
      if [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "Kein .env in $DEPLOY_DIR — erzeuge einmalig frische Konfiguration."
        ( umask 077
          {
            echo "COVEY_MASTER_KEY=$(openssl rand -hex 32)"
            echo "COVEY_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "COVEY_ADMIN_EMAIL=admin@covey.local"
            echo "COVEY_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "COVEY_PUBLIC_URL=${COVEY_PUBLIC_URL:-http://localhost:8494}"
          } > "$DEPLOY_DIR/.env" )
        echo "WICHTIG: $DEPLOY_DIR/.env sichern — enthält den Master-Key. Admin-Passwort steht dort."
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Image auf den unveränderlichen Commit-Tag pinnen ("spezieller Tag").
    - export COVEY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Sandbox-Image HIER pullen (der Host-Daemon hat danach das Image lokal):
    # `docker run` aus dem covey-Container heraus hat keine Registry-Credentials,
    # darf also nie selbst pullen müssen.
    - export COVEY_SANDBOX_IMAGE="$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
    - docker pull "$COVEY_SANDBOX_IMAGE"
    - echo "Deploye $COVEY_IMAGE (Sandbox $COVEY_SANDBOX_IMAGE) nach $DEPLOY_DIR"
    - cd "$DEPLOY_DIR"
    # Die aktuellen Image-Tags zusätzlich in der .env persistieren: nur so
    # funktionieren manuelle Compose-Befehle auf dem Host (z. B.
    # `docker compose run --rm covey passwd …`) ohne exportierte Variablen.
    # Die Secrets in der .env bleiben unberührt; beim CI-Lauf selbst gewinnt
    # weiterhin die Shell-Umgebung über die .env-Interpolation.
    - |
      for var in COVEY_IMAGE COVEY_SANDBOX_IMAGE; do
        val=$(printenv "$var")
        if grep -q "^$var=" .env; then
          sed -i "s|^$var=.*|$var=$val|" .env
        else
          echo "$var=$val" >> .env
        fi
      done
    # COVEY_IMAGE kommt aus der Shell-Umgebung (überschreibt .env-Interpolation),
    # alle Secrets liest Compose automatisch aus der .env im Ordner.
    - docker compose pull
    - docker compose up -d --remove-orphans
    - docker compose ps
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
