# GitLab CI für Covey.
#
# Pipeline: test → build → deploy.
# - test:  govulncheck (Abhängigkeiten gegen die Go-Schwachstellendatenbank),
#          Frontend-Tests + Build (web/dist muss für //go:embed existieren),
#          dann gofmt-Prüfung, go vet und go test.
#          go test läuft mit -coverprofile: GitLab bekommt den Gesamt-Prozentwert
#          als Badge (coverage-Regex) und einen Cobertura-Report für die
#          MR-Diff-Coverage-Anzeige.
#          Die Integrationstests skippen automatisch, weil in der CI kein Postgres
#          auf localhost:5433 erreichbar ist (siehe internal/integration/stack_test.go).
# - build: Docker-Image aus dem Multi-Stage-Dockerfile via docker:dind bauen
#          und in die GitLab Container Registry pushen ($CI_REGISTRY_IMAGE).
#
# Tags: jeder Push auf einen Branch → :$CI_COMMIT_SHORT_SHA,
#       Default-Branch zusätzlich → :latest,
#       Git-Tags zusätzlich → :$CI_COMMIT_TAG.
#
# dind läuft ohne TLS (DOCKER_TLS_CERTDIR="") auf tcp://docker:2375 — dieselbe
# Konfiguration, die im feeval-Projekt auf demselben Runner funktioniert.
#
# - deploy: Nach jedem main-Push das gerade gebaute Image (auf den Commit-Tag
#           :$CI_COMMIT_SHORT_SHA gepinnt) auf dem Zielhost ausrollen. Läuft auf
#           einem Shell-Runner AM Host (Tag `covey-deploy`): kopiert
#           docker-compose.deploy.yml in den Deploy-Ordner und startet
#           `docker compose pull && up -d`. Secrets liegen in einer persistenten
#           `.env` im Deploy-Ordner (einmalig erzeugt, nie überschrieben).

workflow:
  rules:
    # Keine doppelten Pipelines: bei offenem MR nur die MR-Pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - deploy

security:
  stage: test
  image: golang:1.26
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    # Version gepinnt statt @latest: Ein Werkzeug, das bei jedem Lauf frisch
    # aus dem Netz gezogen wird, ist selbst ein Einfallstor — ein
    # kompromittiertes Release liefe ungefragt in der Pipeline, mit Zugriff auf
    # deren Umgebung. Pinnen kostet ein Dependabot-Update im Quartal.
    # govulncheck prüft die Abhängigkeiten gegen die Go-Schwachstellendatenbank
    # — und zwar auf ERREICHBARKEIT: Es meldet nur, was der eigene Code
    # tatsächlich aufruft. Deshalb praktisch ohne Fehlalarme, deshalb als
    # harter Schritt und nicht als Bericht, den niemand liest.
    # (Ein Fund in einem Modul, das wir nur einbinden aber nie aufrufen, lässt
    # den Job bewusst grün — sonst wäre er nach der ersten Woche abgeschaltet.)
    - go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
    # gosec ergaenzt govulncheck: Das eine kennt bekannte Luecken in
    # ABHAENGIGKEITEN, das andere sucht Muster im EIGENEN Code.
    #
    # Bewusst mit einer ausdruecklichen Regel-LISTE statt „alles ausser…":
    # Ungefiltert meldet gosec hier 120 Befunde, und die Masse davon ist der
    # Zweck dieses Programms — der dev-Plugin FUEHRT Shell-Befehle aus (G204),
    # der Arbeitsplatz LIEST Dateien nach Pfad (G304), die Sandbox-Homes
    # brauchen ihre Rechte (G301). Ein Job, der 120 Zeilen ausspuckt, wird nach
    # zwei Wochen weggeklickt. Diese Liste enthaelt die Regeln, auf die wir
    # tatsaechlich reagieren; eine neue kommt dazu, wenn sie sich als
    # aussagekraeftig erweist.
    #
    # Stand: 0 Befunde. Wird das rot, ist es ernst gemeint.
    #
    # -exclude-dir=.go ist hier keine Kosmetik, sondern Pflicht: GOPATH zeigt
    # oben auf $CI_PROJECT_DIR/.go, damit GitLab den Modul-Cache zwischen
    # Laeufen behalten kann (Cache-Pfade muessen im Projektverzeichnis
    # liegen). gosec loest ./... aber ueber das Dateisystem auf, nicht ueber
    # `go list` — und lief damit durch jede fremde Abhaengigkeit unter
    # .go/pkg/mod: 6167 Dateien, 2,7 Mio. Zeilen, 320 Befunde, keiner davon
    # im eigenen Code, dafuer 15 Minuten Laufzeit und Exit 1. Dieselbe Falle,
    # gegen die die gofmt-Zeile in test-go sich schon mit `go list` wehrt.
    - go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet -exclude-dir=.go -include=G101,G102,G106,G107,G112,G114,G201,G202,G203,G303,G305,G401,G402,G403,G404,G501,G502,G503,G504,G601 ./...

build-web:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    # Erst die Tests, dann der Build: Ein Bundle, das gebaut wird, obwohl die
    # Oberfläche nachweislich kaputt ist, kostet nur Zeit und verschleiert den
    # Befund. `npm run build` fährt ohnehin `tsc -b` mit.
    - npm test
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 hour

test-go:
  stage: test
  image: golang:1.26
  needs:
    - build-web
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: go-mod
    paths:
      - .go/pkg/mod/
  script:
    # Formatierung ist keine Geschmacksfrage: unformatierter Code macht jeden
    # späteren Diff größer als die Änderung, die er transportiert. gofmt -l
    # nennt die Abweichler (tee zeigt sie im Job-Log), test -z lässt den Job
    # scheitern, sobald die Liste nicht leer ist. Die Pfade kommen aus
    # `go list`, damit nicht der Modul-Cache unter $GOPATH mitgeprüft wird.
    - test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...) | tee /dev/stderr)"
    - go vet ./...
    # Coverage über alle Pakete messen: -coverpkg=./... zählt auch Zeilen, die
    # aus Tests anderer Pakete heraus abgedeckt werden (sonst nur paket-lokal).
    - go test -coverprofile=coverage.out -coverpkg=./... ./...
    # Gesamt-Prozentwert für den GitLab-Coverage-Badge (siehe coverage-Regex unten).
    - go tool cover -func=coverage.out | tee coverage.txt
    # Cobertura-Report für die MR-Diff-Coverage-Anzeige in GitLab.
    # v1.5.0 statt v1.3.0: Letzteres zieht golang.org/x/tools v0.8.0 mit, und
    # das laesst sich mit Go 1.26 nicht mehr uebersetzen ("invalid array
    # length -delta * delta"). Der Job scheiterte deshalb an dieser letzten
    # Zeile — nach gruenen Tests, weshalb GitLab den Coverage-Wert noch anzeigte.
    - go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml
  # GitLab liest den Gesamt-Coverage aus der Ausgabe von `go tool cover -func`
  # (letzte Zeile "total: … 42.7%") und zeigt ihn als Badge/Trend an.
  coverage: '/^total:\s+\(statements\)\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.txt
    expire_in: 1 week

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    # dind ohne TLS: leeres CERTDIR => Daemon lauscht auf tcp://docker:2375
    # (plain), DOCKER_HOST zeigt den Client explizit dorthin. Ohne diese zwei
    # Zeilen liegt der Daemon (mit TLS-CERTDIR) auf 2376, der Client defaultet
    # aber auf 2375 => "Cannot connect to the Docker daemon at tcp://docker:2375".
    # Erprobt im feeval-Projekt auf demselben Runner.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    # Herkunft ins Binary schreiben (internal/buildinfo): im Image gibt es kein
    # .git, also reicht die CI Tag/Commit/Bauzeit als Build-Args durch.
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        --build-arg "COMMIT=$CI_COMMIT_SHORT_SHA"
        --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    # Auf MRs nur bauen (Smoke-Test), nicht pushen — dort fehlt oft das Registry-Recht.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Sandbox-Image (coveyd + Claude-Code-Runtime, Dockerfile.sandbox) für den
# docker-SandboxProvider. Gleiche Tag-Logik wie build-image, eigener
# Registry-Pfad :$CI_REGISTRY_IMAGE/sandbox.
build-sandbox-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - test-go
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    PUSH_IMAGE: "true"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE/sandbox:latest" || true
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE/sandbox:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        --build-arg "COMMIT=$CI_COMMIT_SHORT_SHA"
        --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        --file Dockerfile.sandbox
        --tag "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
        .
    - |
      if [ "$PUSH_IMAGE" != "true" ]; then
        echo "MR-Pipeline: Sandbox-Image nur gebaut, nicht gepusht."
        exit 0
      fi
    - docker push "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/sandbox:latest"
        docker push "$CI_REGISTRY_IMAGE/sandbox:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Rollt das gerade gebaute Image auf dem Zielhost aus. Voraussetzung: ein
# GitLab-Runner mit Executor `shell` läuft AUF dem Zielhost und ist mit dem Tag
# `covey-deploy` registriert; Docker + Compose-Plugin sind dort installiert.
#
# Konfigurierbar über CI/CD-Variablen (Settings → CI/CD → Variables):
#   DEPLOY_DIR         Zielordner auf dem Host (Default /opt/covey)
#   COVEY_PUBLIC_URL   öffentliche URL (nur beim ERSTEN Deploy in die .env
#                      geschrieben; danach dort pflegen)
deploy:
  stage: deploy
  tags:
    - covey-deploy
  needs:
    - build-image
    - build-sandbox-image
  variables:
    DEPLOY_DIR: /opt/covey
    GIT_STRATEGY: fetch
  script:
    - mkdir -p "$DEPLOY_DIR"
    # Compose-Datei ist versionierte Config → bei jedem Deploy aktualisieren.
    - cp docker-compose.deploy.yml "$DEPLOY_DIR/docker-compose.yml"
    # Secrets liegen in einer persistenten .env im Deploy-Ordner. Beim ersten
    # Deploy einmalig erzeugen (Master-Key + Passwörter zufällig), danach NIE
    # anfassen — ein Master-Key-Wechsel macht alle hinterlegten Secrets unlesbar.
    - |
      if [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "Kein .env in $DEPLOY_DIR — erzeuge einmalig frische Konfiguration."
        ( umask 077
          {
            echo "COVEY_MASTER_KEY=$(openssl rand -hex 32)"
            echo "COVEY_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "COVEY_ADMIN_EMAIL=admin@covey.local"
            echo "COVEY_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "COVEY_PUBLIC_URL=${COVEY_PUBLIC_URL:-http://localhost:8494}"
          } > "$DEPLOY_DIR/.env" )
        echo "WICHTIG: $DEPLOY_DIR/.env sichern — enthält den Master-Key. Admin-Passwort steht dort."
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Alte Images wegräumen, BEVOR das neue gezogen wird. Jeder Deploy legt zwei
    # Images auf dem Host ab (covey:<sha> und sandbox:<sha>, letzteres mit
    # Chromium über 2 GB) — ohne Aufräumen läuft die Platte voll und der Pull
    # scheitert mit "no space left on device" (so geschehen bei Pipeline 539).
    #
    # `until=24h` lässt alles von heute stehen: das gerade laufende Image, die
    # Rollback-Ziele der letzten Deploys und vor allem das aktuelle
    # Sandbox-Image, das an KEINEM laufenden Container hängt (Sandboxen sind
    # ephemer) und von `prune -a` sonst mitgenommen würde. Volumes werden nie
    # angefasst — dort liegt die Datenbank.
    - docker system df || true
    - docker image prune -af --filter "until=24h" || true
    - docker system df || true
    # Image auf den unveränderlichen Commit-Tag pinnen ("spezieller Tag").
    - export COVEY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Sandbox-Image HIER pullen (der Host-Daemon hat danach das Image lokal):
    # `docker run` aus dem covey-Container heraus hat keine Registry-Credentials,
    # darf also nie selbst pullen müssen.
    - export COVEY_SANDBOX_IMAGE="$CI_REGISTRY_IMAGE/sandbox:$CI_COMMIT_SHORT_SHA"
    # Reicht das schonende Aufräumen nicht (etwa weil die Platte allein durch die
    # Deploys von heute vollgelaufen ist), einmal hart aufräumen und erneut
    # ziehen. `prune -a` nimmt dann auch das bisherige Sandbox-Image mit — das
    # ist verschmerzbar, weil direkt danach das neue kommt, und allemal besser
    # als ein Deploy, der gar nicht durchgeht.
    - |
      if ! docker pull "$COVEY_SANDBOX_IMAGE"; then
        echo "Pull fehlgeschlagen — räume alle ungenutzten Images weg und versuche erneut."
        docker image prune -af || true
        docker system df || true
        docker pull "$COVEY_SANDBOX_IMAGE"
      fi
    - echo "Deploye $COVEY_IMAGE (Sandbox $COVEY_SANDBOX_IMAGE) nach $DEPLOY_DIR"
    - cd "$DEPLOY_DIR"
    # Die aktuellen Image-Tags zusätzlich in der .env persistieren: nur so
    # funktionieren manuelle Compose-Befehle auf dem Host (z. B.
    # `docker compose run --rm covey passwd …`) ohne exportierte Variablen.
    # Die Secrets in der .env bleiben unberührt; beim CI-Lauf selbst gewinnt
    # weiterhin die Shell-Umgebung über die .env-Interpolation.
    - |
      for var in COVEY_IMAGE COVEY_SANDBOX_IMAGE; do
        val=$(printenv "$var")
        if grep -q "^$var=" .env; then
          sed -i "s|^$var=.*|$var=$val|" .env
        else
          echo "$var=$val" >> .env
        fi
      done
    # COVEY_IMAGE kommt aus der Shell-Umgebung (überschreibt .env-Interpolation),
    # alle Secrets liest Compose automatisch aus der .env im Ordner.
    - docker compose pull
    - docker compose up -d --remove-orphans
    - docker compose ps
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
