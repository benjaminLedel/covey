      DIRECTION CONTRACT — the visual world of the control plane.

      THESIS: The workforce is a registry of personnel files, not a wall of
      cards. It refuses the SaaS dashboard's card grid and its colour-coded
      status chips.

      OWN-WORLD: Exactly neutral greys, layered rather than coloured — ground,
      a darker pressed-in surface, and form white for what is raised. No hue in
      any ground. State is carried by a drawn MARK whose shape says it (filled
      runs, hollow rests, dashed undecided, barred held up, crossed ended), so
      the state palette needs no colour and has none. Red is the single
      exception and means only "this ended against its purpose". Printed matter
      and made entries stay visibly different registers.

      STORY: An admin sees who is employed, what each may do, what it cost, and
      who signed for it.

      FIRST VIEWPORT: Agents as a register — a tab strip, then one row per
      agent carrying name, role, supervisor, a state mark whose SHAPE carries
      the state, budget and last activity. Applications sit above as unfilled
      rows; the vacancy is drawn, not omitted.

      FORM: The personnel file, candidate 1 of the ordered list, chosen over
      the assigned duty roster (seed b1fa3354).

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
