<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="covey">
  <!-- Die Marke in ihrer Kachel-Fassung: eine flache Lehm-Kachel, der Schwarm
       in Weiss. Ein Wert, eine Geometrie, ein Radius (14/64) — vorher gab es
       drei Kachelfarben (Verlauf, Tinte, Lehm) und zwei Groessen des Zeichens,
       weil vier Dateien dieselbe Marke unabhaengig voneinander zeichneten.

       Flach statt Verlauf: Was bei 512px als weicher Verlauf gemeint war, ist
       bei 16px ein schmutziger Fleck. Lehm statt Tinte: Die Kachel steht damit
       auf heller wie dunkler Browserleiste, und die Umkehrung nach
       prefers-color-scheme entfaellt — die PNG-Fassungen konnten sie ohnehin
       nie mitmachen, was der dokumentierte Kompromiss war. -->
  <rect width="64" height="64" rx="14" fill="#cc7a5b"/>
  <g transform="translate(-0.7,1.1) scale(2.9)" fill="none" stroke="#ffffff" stroke-width="2.3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 15 Q9.75 11.8 12.5 15 Q15.25 11.8 18 15"/>
    <path d="M3.5 10 Q5.5 7.7 7.5 10 Q9.5 7.7 11.5 10"/>
    <path d="M13 8 Q14.5 6.3 16 8 Q17.5 6.3 19 8"/>
  </g>
</svg>
