# The order of the docs area: order of the sections, order of the pages inside
# them, and what a section is called in the navigation.
#
# Why here and not from the file system: an alphabetical order puts "Architektur"
# before "Was ist covey?", and the docs have a reading direction. The titles of
# the sections stand here too, because they belong to no page — they are headings
# of the navigation.
#
# The rest stands in the pages themselves: address, title, description and FAQ in
# the frontmatter of each file (docs/en/… is the source, docs/de/… the
# translation under the same relative path).
#
# A page that is missing here is not served — the test in
# web/src/public/docs/docs.test.ts says that.

sections:
  - id: introduction
    title: { de: Einführung, en: Introduction }
    pages:
      - what-is-covey
      - core-concepts
      - architecture

  - id: getting-started
    title: { de: Erste Schritte, en: Getting started }
    pages:
      - quickstart
      - first-agent

  - id: concepts
    title: { de: Konzepte, en: Concepts }
    pages:
      - agent-model
      - memory
      - guard-rails
      - identity-and-secrets
      - backlog-and-lifecycle

  # The overview stands first, the recipes after it alphabetically: whoever
  # looks for a target system looks for it under its name.
  - id: integrations
    title: { de: Integrationen, en: Integrations }
    pages:
      - target-systems
      - browser
      - confluence
      - email
      - github
      - gitlab
      - jira
      - kubernetes
      - nextcloud
      - sharepoint
      - teams
      - vulndb
      - zammad
      - zendesk

  - id: operations
    title: { de: Betrieb, en: Operations }
    pages:
      - operations
      - deployment
      - mail
      - upgrade
      - runner
      - workplaces
      - api-keys
      - telemetry

  - id: companion
    title: { de: Companion, en: Companion }
    pages:
      - companion
