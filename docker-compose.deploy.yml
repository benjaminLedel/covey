# covey — production compose for the automatic deployment.
#
# Unlike docker-compose.yml (builds the image locally, for trying things out
# locally) this file pulls a *finished* image from the registry, pinned per
# deploy to one concrete, immutable tag:
#
#   COVEY_IMAGE=registry.lapco.legal/private_bl/covey:<commit-sha>
#
# The GitLab deploy job (see .gitlab-ci.yml, job `deploy`) copies this file into
# the deploy folder on the host, sets COVEY_IMAGE to the tag of the commit just
# built, and starts `docker compose pull && up -d`.
#
# Secrets (master key, passwords, public URL) do NOT live here but in a
# persistent `.env` in the same folder. That `.env` is created once on the first
# deploy and never overwritten again afterwards — the master key encrypts and
# decrypts every stored secret, changing it would render them unreadable.
# Therefore: back up `.env`.
#
# Sandboxes run as sibling containers (docker SandboxProvider): the
# covey container gets the host's Docker socket and starts one container
# per wake from the agent's workplace image (from the public catalogue,
# see below). So that the `-v` paths of the sandbox homes match for the
# host daemon, the data directory is a bind mount under the IDENTICAL
# path on host and in the container (COVEY_DATA_DIR, default
# /opt/covey/data) — a named volume would not be addressable for
# `docker run -v` from inside the container.

x-covey-base: &covey-base
  image: ${COVEY_IMAGE:?COVEY_IMAGE muss gesetzt sein, z. B. registry/…/covey:<sha>}
  environment:
    COVEY_DATABASE_URL: postgres://covey:${COVEY_POSTGRES_PASSWORD:?in .env setzen}@db:5432/covey?sslmode=disable
    COVEY_MASTER_KEY: ${COVEY_MASTER_KEY:?in .env setzen — 64 Hex-Zeichen, openssl rand -hex 32}
    COVEY_PUBLIC_URL: ${COVEY_PUBLIC_URL:-http://localhost:8494}
    COVEY_LISTEN_ADDR: ":8494"
    COVEY_DATA_DIR: ${COVEY_DATA_DIR:-/opt/covey/data}
    COVEY_ADMIN_EMAIL: ${COVEY_ADMIN_EMAIL:-admin@covey.local}
    COVEY_ADMIN_PASSWORD: ${COVEY_ADMIN_PASSWORD:?in .env setzen}
    COVEY_SANDBOX_PROVIDER: docker
    # Which image stands behind a workplace is said by the PUBLISHED catalogue
    # (spec/16): one JSON file beside the source, pinned per covey version by
    # digest, public on ghcr. So nothing stands here.
    #
    # Before, two lines with private registry references stood here, pinned
    # to the deployed commit — and a set variable beats the catalogue. That
    # worked as long as the deploy host was the only machine. With the first
    # own runner it stopped working: the host got `denied: access forbidden`
    # because it does not have the credentials to the private registry and
    # should never get them.
    #
    # Whoever does want to run their own image — a fork, an installation without
    # internet — sets COVEY_SANDBOX_IMAGE (profile `base`) or
    # COVEY_SANDBOX_IMAGE_<PROFILE> in the `.env`, hyphens as underscores:
    # COVEY_SANDBOX_IMAGE_DEV, COVEY_SANDBOX_IMAGE_DEV_FLUTTER. The variable
    # still wins; it is only no longer the default.
    # Wiki upkeep (spec/05): files each agent a tidying task daily (merge
    # duplicates, repair dead [[links]]). The central consolidation pass works
    # purely on embedding similarity and therefore only touches near-identical
    # pages — the tidying by content is what this heartbeat adds. Costs one LLM
    # run per agent per day; empty = off.
    COVEY_WIKI_CLEANUP: ${COVEY_WIKI_CLEANUP:-03:00}
    # Embedding behind the wiki search. The default `builtin` only measures
    # word overlap — that way an agent does not find its own page again once
    # it phrased things differently. Two ways to semantic retrieval, both
    # through the `.env`:
    #
    #   run it yourself (recommended — the wiki content stays in the house):
    #     COMPOSE_PROFILES=embeddings
    #     COVEY_EMBEDDING_PROVIDER=ollama
    #
    #   foreign service:
    #     COVEY_EMBEDDING_PROVIDER=voyage   (or openai)
    #     COVEY_EMBEDDING_API_KEY=…
    #
    # The existing stock is re-embedded automatically on the next start.
    COVEY_EMBEDDING_PROVIDER: ${COVEY_EMBEDDING_PROVIDER:-builtin}
    COVEY_EMBEDDING_MODEL: ${COVEY_EMBEDDING_MODEL:-}
    COVEY_EMBEDDING_API_KEY: ${COVEY_EMBEDDING_API_KEY:-}
    COVEY_EMBEDDING_URL: ${COVEY_EMBEDDING_URL:-}
  volumes:
    - ${COVEY_DATA_DIR:-/opt/covey/data}:${COVEY_DATA_DIR:-/opt/covey/data}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: covey
      POSTGRES_PASSWORD: ${COVEY_POSTGRES_PASSWORD:?in .env setzen}
      POSTGRES_DB: covey
    volumes:
      - covey-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covey -d covey"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # One init per deploy: organisation + admin + demo agent (idempotent).
  # Ends afterwards; blocks `covey` from starting until it has run through.
  bootstrap:
    <<: *covey-base
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Control plane: API + orchestrator + embedded admin UI. Migrations run
  # automatically at `serve` start (advisory lock).
  covey:
    <<: *covey-base
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${COVEY_PORT:-8494}:8494"
    # A YAML merge replaces lists entirely — which is why both mounts are spelled
    # out here: data directory (as in the base) plus Docker socket for the sandbox provider.
    volumes:
      - ${COVEY_DATA_DIR:-/opt/covey/data}:${COVEY_DATA_DIR:-/opt/covey/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Self-hosted embedding for the wiki memory (spec/05). Off as long as
  # `COMPOSE_PROFILES=embeddings` is not in the .env — whoever uses a foreign
  # service or stays with the built-in does not get this container.
  #
  # The default model is EmbeddingGemma (308M): multilingual, runs on CPU and is
  # Matryoshka-trained, so it delivers the 256 dimensions the schema expects. No
  # key, no egress to third parties.
  embeddings:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    volumes:
      - covey-ollama:/root/.ollama
    restart: unless-stopped

  # One model pull per deploy (idempotent — if the model already lies in the
  # volume, the job returns right away). Ollama does NOT pull a missing model
  # itself on an embedding call, which is why this step exists.
  embeddings-init:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    depends_on:
      - embeddings
    environment:
      OLLAMA_HOST: http://embeddings:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until ollama list >/dev/null 2>&1; do echo "warte auf embeddings…"; sleep 2; done;
        ollama pull "${COVEY_EMBEDDING_MODEL:-embeddinggemma}"
    restart: "no"

volumes:
  covey-db:
  covey-ollama:
