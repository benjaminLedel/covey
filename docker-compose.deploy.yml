# Covey — Produktions-Compose für das automatische Deployment.
#
# Im Unterschied zu docker-compose.yml (baut das Image lokal, für lokales
# Ausprobieren) zieht diese Datei ein *fertiges* Image aus der Registry, pro
# Deploy auf einen konkreten, unveränderlichen Tag gepinnt:
#
#   COVEY_IMAGE=registry.lapco.legal/private_bl/covey:<commit-sha>
#
# Der GitLab-Deploy-Job (siehe .gitlab-ci.yml, Job `deploy`) kopiert diese Datei
# in den Deploy-Ordner auf dem Host, setzt COVEY_IMAGE auf den Tag des gerade
# gebauten Commits und startet `docker compose pull && up -d`.
#
# Secrets (Master-Key, Passwörter, öffentliche URL) liegen NICHT hier, sondern
# in einer persistenten `.env` im selben Ordner. Diese `.env` wird beim ersten
# Deploy einmalig erzeugt und danach NIE wieder überschrieben — der Master-Key
# ver-/entschlüsselt alle hinterlegten Secrets, ein Wechsel würde sie unlesbar
# machen. Deshalb: `.env` sichern.
#
# Sandboxen laufen als Sibling-Container (docker-SandboxProvider): der
# covey-Container bekommt den Docker-Socket des Hosts und startet pro Wake
# einen Container aus COVEY_SANDBOX_IMAGE (Dockerfile.sandbox, gepusht von der
# CI, im Deploy-Job auf den Commit gepinnt). Damit die `-v`-Pfade der
# Sandbox-Homes für den Host-Daemon stimmen, ist das Datenverzeichnis ein
# Bind-Mount unter IDENTISCHEM Pfad auf Host und im Container (COVEY_DATA_DIR,
# Default /opt/covey/data) — ein benanntes Volume wäre für `docker run -v`
# vom Container aus nicht adressierbar.

x-covey-base: &covey-base
  image: ${COVEY_IMAGE:?COVEY_IMAGE muss gesetzt sein, z. B. registry/…/covey:<sha>}
  environment:
    COVEY_DATABASE_URL: postgres://covey:${COVEY_POSTGRES_PASSWORD:?in .env setzen}@db:5432/covey?sslmode=disable
    COVEY_MASTER_KEY: ${COVEY_MASTER_KEY:?in .env setzen — 64 Hex-Zeichen, openssl rand -hex 32}
    COVEY_PUBLIC_URL: ${COVEY_PUBLIC_URL:-http://localhost:8494}
    COVEY_LISTEN_ADDR: ":8494"
    COVEY_DATA_DIR: ${COVEY_DATA_DIR:-/opt/covey/data}
    COVEY_ADMIN_EMAIL: ${COVEY_ADMIN_EMAIL:-admin@covey.local}
    COVEY_ADMIN_PASSWORD: ${COVEY_ADMIN_PASSWORD:?in .env setzen}
    COVEY_SANDBOX_PROVIDER: docker
    COVEY_SANDBOX_IMAGE: ${COVEY_SANDBOX_IMAGE:-covey-sandbox:latest}
    # Der zweite Arbeitsplatz (Profil `dev`: PHP, JDK, fvm, uv obendrauf). Seit
    # der Aufteilung in zwei Profile braucht ihn jede Installation, die
    # Entwickler-Agenten hat — die Migration hat Bestandsagenten genau dorthin
    # gesetzt, weil das Image VOR der Aufteilung all das trug.
    #
    # Ohne diese Zeile sucht der Host `covey-sandbox-dev:latest`, das eine
    # Container-Installation nirgends her hat, und jedes Wecken scheitert am
    # Start der Sandbox. Wer noch das alte, ungeteilte Image liegen hat, zeigt
    # hier darauf — es IST der dev-Arbeitsplatz.
    COVEY_SANDBOX_IMAGE_DEV: ${COVEY_SANDBOX_IMAGE_DEV:-covey-sandbox-dev:latest}
    # Wiki-Pflege (spec/05): legt jedem Agenten täglich einen Aufräum-Task an
    # (Duplikate zusammenführen, tote [[Verweise]] korrigieren). Der zentrale
    # Konsolidierungs-Pass arbeitet rein über Embedding-Ähnlichkeit und fasst
    # damit nur Beinahe-Identisches an — das inhaltliche Aufräumen leistet erst
    # dieser Heartbeat. Kostet pro Agent einen LLM-Lauf pro Tag; leer = aus.
    COVEY_WIKI_CLEANUP: ${COVEY_WIKI_CLEANUP:-03:00}
    # Embedding hinter der Wiki-Suche. Der Default `builtin` misst nur
    # Wortüberlappung — damit findet ein Agent seine eigene Seite nicht wieder,
    # sobald er anders formuliert. Zwei Wege zu semantischem Retrieval, beide
    # über die `.env`:
    #
    #   selbst betreiben (empfohlen — die Wiki-Inhalte verlassen das Haus nicht):
    #     COMPOSE_PROFILES=embeddings
    #     COVEY_EMBEDDING_PROVIDER=ollama
    #
    #   fremder Dienst:
    #     COVEY_EMBEDDING_PROVIDER=voyage   (oder openai)
    #     COVEY_EMBEDDING_API_KEY=…
    #
    # Der Bestand wird beim nächsten Start automatisch neu eingebettet.
    COVEY_EMBEDDING_PROVIDER: ${COVEY_EMBEDDING_PROVIDER:-builtin}
    COVEY_EMBEDDING_MODEL: ${COVEY_EMBEDDING_MODEL:-}
    COVEY_EMBEDDING_API_KEY: ${COVEY_EMBEDDING_API_KEY:-}
    COVEY_EMBEDDING_URL: ${COVEY_EMBEDDING_URL:-}
  volumes:
    - ${COVEY_DATA_DIR:-/opt/covey/data}:${COVEY_DATA_DIR:-/opt/covey/data}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: covey
      POSTGRES_PASSWORD: ${COVEY_POSTGRES_PASSWORD:?in .env setzen}
      POSTGRES_DB: covey
    volumes:
      - covey-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covey -d covey"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # Einmaliger Init pro Deploy: Organisation + Admin + Demo-Agent (idempotent).
  # Beendet sich danach; blockiert den Start von `covey` bis erfolgreich durch.
  bootstrap:
    <<: *covey-base
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Control Plane: API + Orchestrator + eingebettete Admin-UI. Migrationen
  # laufen beim `serve`-Start automatisch (Advisory-Lock).
  covey:
    <<: *covey-base
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${COVEY_PORT:-8494}:8494"
    # YAML-Merge ersetzt Listen komplett — deshalb hier beide Mounts explizit:
    # Datenverzeichnis (wie Base) plus Docker-Socket für den Sandbox-Provider.
    volumes:
      - ${COVEY_DATA_DIR:-/opt/covey/data}:${COVEY_DATA_DIR:-/opt/covey/data}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Selbstgehostetes Embedding für das Wiki-Gedächtnis (spec/05). Aus, solange
  # `COMPOSE_PROFILES=embeddings` nicht in der .env steht — wer einen fremden
  # Dienst nutzt oder beim Built-in bleibt, bekommt diesen Container nicht.
  #
  # Default-Modell ist EmbeddingGemma (308M): mehrsprachig, läuft auf CPU und
  # ist Matryoshka-trainiert, liefert also die vom Schema erwarteten 256
  # Dimensionen. Kein Schlüssel, kein Egress zu Dritten.
  embeddings:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    volumes:
      - covey-ollama:/root/.ollama
    restart: unless-stopped

  # Einmaliger Modell-Pull pro Deploy (idempotent — liegt das Modell schon im
  # Volume, kehrt der Job sofort zurück). Ollama zieht ein fehlendes Modell
  # beim Embedding-Aufruf NICHT selbst nach, deshalb dieser Schritt.
  embeddings-init:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    depends_on:
      - embeddings
    environment:
      OLLAMA_HOST: http://embeddings:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until ollama list >/dev/null 2>&1; do echo "warte auf embeddings…"; sleep 2; done;
        ollama pull "${COVEY_EMBEDDING_MODEL:-embeddinggemma}"
    restart: "no"

volumes:
  covey-db:
  covey-ollama:
